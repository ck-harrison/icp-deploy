<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICP Deploy</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            icp: { 50: '#f0f4ff', 100: '#dbe4ff', 200: '#bac8ff', 400: '#748ffc', 500: '#4c6ef5', 600: '#3b5bdb', 700: '#364fc7', 800: '#1e3a8a', 900: '#0f172a' },
            surface: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 700: '#334155', 800: '#1e293b', 900: '#0f172a', 950: '#020617' }
          }
        }
      }
    }
  </script>
  <style>
    body { background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .log-container { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px; }
    .log-container::-webkit-scrollbar { width: 6px; }
    .log-container::-webkit-scrollbar-track { background: transparent; }
    .log-container::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(76, 110, 245, 0.4); } 50% { box-shadow: 0 0 12px 4px rgba(76, 110, 245, 0.2); } }
    .deploying { animation: pulse-glow 2s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 1s linear infinite; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ---- Validation helpers ----
    // Canister IDs are base32-encoded with dashes: xxxxx-xxxxx-xxxxx-xxxxx-cai
    const isValidCanisterId = (id) => /^[a-z0-9\-]+$/.test(id);

    // ---- API helpers ----
    const api = {
      async get(url) {
        const r = await fetch(url, {
          headers: { 'X-Requested-With': 'CanisterPanel' },
        });
        if (!r.ok) {
          const body = await r.json().catch(() => ({}));
          throw new Error(body.error || `HTTP ${r.status}`);
        }
        return r.json();
      },
      async post(url, body) {
        const r = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'CanisterPanel' },
          body: JSON.stringify(body),
        });
        if (!r.ok) {
          const errBody = await r.json().catch(() => ({}));
          throw new Error(errBody.error || `HTTP ${r.status}`);
        }
        return r.json();
      },
    };

    // ---- Icon components ----
    function FolderIcon({ className = 'w-5 h-5' }) {
      return (
        <svg className={className} fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor">
          <path strokeLinecap="round" strokeLinejoin="round" d="M2.25 12.75V12A2.25 2.25 0 0 1 4.5 9.75h15A2.25 2.25 0 0 1 21.75 12v.75m-8.69-6.44-2.12-2.12a1.5 1.5 0 0 0-1.061-.44H4.5A2.25 2.25 0 0 0 2.25 6v12a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9a2.25 2.25 0 0 0-2.25-2.25h-5.379a1.5 1.5 0 0 1-1.06-.44Z" />
        </svg>
      );
    }

    function ChevronIcon({ className = 'w-4 h-4', direction = 'right' }) {
      const rotation = { right: '', down: 'rotate-90', left: 'rotate-180', up: '-rotate-90' };
      return (
        <svg className={`${className} ${rotation[direction]}`} fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor">
          <path strokeLinecap="round" strokeLinejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
        </svg>
      );
    }

    function RocketIcon({ className = 'w-5 h-5' }) {
      return (
        <svg className={className} fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor">
          <path strokeLinecap="round" strokeLinejoin="round" d="M15.59 14.37a6 6 0 0 1-5.84 7.38v-4.8m5.84-2.58a14.98 14.98 0 0 0 6.16-12.12A14.98 14.98 0 0 0 9.631 8.41m5.96 5.96a14.926 14.926 0 0 1-5.841 2.58m-.119-8.54a6 6 0 0 0-7.381 5.84h4.8m2.581-5.84a14.927 14.927 0 0 0-2.58 5.84m2.699 2.7c-.103.021-.207.041-.311.06a15.09 15.09 0 0 1-2.448-2.448 14.9 14.9 0 0 1 .06-.312m-2.24 2.39a4.493 4.493 0 0 0-1.757 4.306 4.493 4.493 0 0 0 4.306-1.758M16.5 9a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z" />
        </svg>
      );
    }

    function SpinnerIcon({ className = 'w-5 h-5' }) {
      return (
        <svg className={`${className} spinner`} fill="none" viewBox="0 0 24 24">
          <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" />
          <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" />
        </svg>
      );
    }

    // ---- Folder Browser Modal ----
    function FolderBrowser({ isOpen, onClose, onSelect }) {
      const [currentPath, setCurrentPath] = useState('');
      const [entries, setEntries] = useState([]);
      const [loading, setLoading] = useState(false);

      const browse = useCallback(async (path) => {
        setLoading(true);
        try {
          const data = await api.post('/api/browse', { path: path || undefined });
          setCurrentPath(data.current);
          setEntries(data.entries);
        } catch (e) {
          console.error(e);
        }
        setLoading(false);
      }, []);

      useEffect(() => {
        if (isOpen) browse('');
      }, [isOpen, browse]);

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-surface-900 border border-surface-700 rounded-2xl w-full max-w-lg shadow-2xl">
            <div className="p-4 border-b border-surface-700 flex items-center justify-between">
              <h3 className="text-white font-semibold">Select Project Folder</h3>
              <button onClick={onClose} className="text-gray-400 hover:text-white text-xl">&times;</button>
            </div>
            <div className="p-3 bg-surface-950 border-b border-surface-700">
              <div className="flex items-center gap-2 text-sm text-gray-400 font-mono">
                <FolderIcon className="w-4 h-4 text-icp-400 shrink-0" />
                <span className="truncate">{currentPath}</span>
              </div>
            </div>
            <div className="max-h-80 overflow-y-auto p-2">
              {currentPath && (
                <button
                  onClick={() => {
                    const parent = currentPath.split('/').slice(0, -1).join('/') || '/';
                    browse(parent);
                  }}
                  className="w-full flex items-center gap-3 p-2.5 rounded-lg hover:bg-surface-800 text-gray-300"
                >
                  <ChevronIcon direction="left" className="w-4 h-4 text-gray-500" />
                  <span className="text-sm">..</span>
                </button>
              )}
              {loading ? (
                <div className="flex items-center justify-center py-8">
                  <SpinnerIcon className="w-6 h-6 text-icp-400" />
                </div>
              ) : (
                entries.map((entry) => (
                  <button
                    key={entry.path}
                    onClick={() => {
                      if (entry.isIcpProject) {
                        onSelect(entry.path);
                        onClose();
                      } else {
                        browse(entry.path);
                      }
                    }}
                    className={`w-full flex items-center gap-3 p-2.5 rounded-lg hover:bg-surface-800 transition-colors ${
                      entry.isIcpProject ? 'bg-icp-500/10 border border-icp-500/20' : ''
                    }`}
                  >
                    <FolderIcon className={`w-5 h-5 ${entry.isIcpProject ? 'text-icp-400' : 'text-gray-500'}`} />
                    <div className="flex-1 text-left">
                      <span className={`text-sm ${entry.isIcpProject ? 'text-white font-medium' : 'text-gray-300'}`}>
                        {entry.name}
                      </span>
                    </div>
                    {entry.isIcpProject ? (
                      <span className="text-[11px] bg-icp-500/20 text-icp-400 px-2 py-0.5 rounded-full font-medium">
                        {entry.hasIcpYaml ? 'ICP project' : 'dfx project'}
                      </span>
                    ) : (
                      <ChevronIcon className="w-4 h-4 text-gray-600" />
                    )}
                  </button>
                ))
              )}
              {!loading && entries.length === 0 && (
                <p className="text-center text-gray-500 py-8 text-sm">No folders found</p>
              )}
            </div>
            <div className="p-3 border-t border-surface-700 flex justify-between items-center">
              <p className="text-xs text-gray-500">Click a highlighted folder to select it</p>
              <button onClick={onClose} className="text-sm text-gray-400 hover:text-white px-3 py-1.5 rounded-lg hover:bg-surface-800">
                Cancel
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ---- Confirmation Modal ----
    function ConfirmModal({ isOpen, title, message, danger, onConfirm, onCancel, confirmPhrase }) {
      const [typed, setTyped] = React.useState('');
      if (!isOpen) return null;
      const phraseMatch = !confirmPhrase || typed === confirmPhrase;
      return (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-surface-900 border border-surface-700 rounded-2xl w-full max-w-md shadow-2xl">
            <div className="p-5">
              <h3 className={`text-base font-semibold ${danger ? 'text-red-400' : 'text-white'} mb-2`}>{title}</h3>
              <p className="text-sm text-gray-400">{message}</p>
              {confirmPhrase && (
                <div className="mt-4">
                  <p className="text-xs text-gray-500 mb-2">Type <span className="font-mono text-gray-300">"{confirmPhrase}"</span> to confirm:</p>
                  <input
                    type="text"
                    value={typed}
                    onChange={(e) => setTyped(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && phraseMatch && onConfirm()}
                    className="w-full bg-surface-800 border border-surface-600 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-red-500"
                    placeholder={confirmPhrase}
                    autoFocus
                  />
                </div>
              )}
            </div>
            <div className="p-4 border-t border-surface-700 flex justify-end gap-2">
              <button onClick={onCancel} className="px-4 py-2 text-sm text-gray-400 hover:text-white rounded-lg hover:bg-surface-800">Cancel</button>
              <button onClick={onConfirm} disabled={!phraseMatch} className={`px-4 py-2 text-sm font-medium rounded-lg disabled:opacity-40 disabled:cursor-not-allowed ${danger ? 'bg-red-500 hover:bg-red-600 text-white' : 'bg-icp-500 hover:bg-icp-600 text-white'}`}>Confirm</button>
            </div>
          </div>
        </div>
      );
    }

    // ---- Controllers Modal ----
    function ControllersModal({ isOpen, canisterName, controllers, principal, projectPath, network, onDone, onClose }) {
      const [newPrincipal, setNewPrincipal] = useState('');
      const [busy, setBusy] = useState(null); // 'add' | principal-being-removed
      const [error, setError] = useState(null);
      const [confirmRemove, setConfirmRemove] = useState(null); // principal to remove

      if (!isOpen) return null;

      const handleAdd = async () => {
        const p = newPrincipal.trim();
        if (!p || !/^[a-z0-9\-]+$/.test(p)) { setError('Invalid principal format'); return; }
        if (controllers.includes(p)) { setError('Already a controller'); return; }
        setError(null);
        setBusy('add');
        try {
          const data = await api.post('/api/canister/update-settings', { path: projectPath, canister: canisterName, network, addController: p });
          if (!data.ok) { setError(data.output || 'Failed to add controller'); }
          else { setNewPrincipal(''); onDone(); }
        } catch (e) { setError(e.message); }
        setBusy(null);
      };

      const handleRemove = async (ctrl) => {
        setConfirmRemove(null);
        setError(null);
        setBusy(ctrl);
        try {
          const data = await api.post('/api/canister/update-settings', { path: projectPath, canister: canisterName, network, removeController: ctrl });
          if (!data.ok) { setError(data.output || 'Failed to remove controller'); }
          else { onDone(); }
        } catch (e) { setError(e.message); }
        setBusy(null);
      };

      return (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-surface-900 border border-surface-700 rounded-2xl w-full max-w-lg shadow-2xl">
            <div className="p-5 border-b border-surface-700 flex items-center justify-between">
              <div>
                <h3 className="text-base font-semibold text-white">Controllers</h3>
                <p className="text-xs text-gray-500 mt-0.5 font-mono">{canisterName}</p>
              </div>
              <button onClick={onClose} className="text-gray-500 hover:text-white transition-colors">
                <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
              </button>
            </div>
            <div className="p-5 space-y-2">
              {controllers.length === 0 && <p className="text-sm text-gray-500">No controller data available.</p>}
              {controllers.map((ctrl) => {
                const isMe = ctrl === principal;
                const isLast = controllers.length === 1;
                const isRemoving = busy === ctrl;
                return (
                  <div key={ctrl} className="flex items-center justify-between gap-3 px-3 py-2.5 bg-surface-800 rounded-lg border border-surface-700">
                    <div className="min-w-0 flex-1">
                      <span className="text-[11px] font-mono text-gray-300 break-all">{ctrl}</span>
                      {isMe && <span className="ml-2 text-[10px] px-1.5 py-0.5 bg-icp-500/10 text-icp-400 border border-icp-500/20 rounded font-medium">you</span>}
                    </div>
                    {confirmRemove === ctrl ? (
                      <div className="flex items-center gap-1.5 shrink-0">
                        <span className="text-[10px] text-red-400">Remove?</span>
                        <button onClick={() => handleRemove(ctrl)} className="text-[10px] px-2 py-1 bg-red-500 text-white rounded font-medium hover:bg-red-600">Yes</button>
                        <button onClick={() => setConfirmRemove(null)} className="text-[10px] px-2 py-1 bg-surface-700 text-gray-300 rounded font-medium hover:bg-surface-600">No</button>
                      </div>
                    ) : (
                      <button
                        onClick={() => { if (!isLast) setConfirmRemove(ctrl); }}
                        disabled={isLast || isRemoving}
                        title={isLast ? 'Cannot remove the only controller' : `Remove ${ctrl}`}
                        className="shrink-0 p-1 text-gray-600 hover:text-red-400 disabled:opacity-30 disabled:cursor-not-allowed transition-colors rounded"
                      >
                        {isRemoving
                          ? <svg className="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/></svg>
                          : <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>}
                      </button>
                    )}
                  </div>
                );
              })}
            </div>
            <div className="px-5 pb-2">
              <p className="text-[11px] font-medium text-gray-400 mb-2">Add controller</p>
              <div className="flex gap-2">
                <input
                  type="text"
                  value={newPrincipal}
                  onChange={(e) => { setNewPrincipal(e.target.value); setError(null); }}
                  onKeyDown={(e) => e.key === 'Enter' && handleAdd()}
                  placeholder="Principal ID (e.g. aaaaa-aa)"
                  className="flex-1 bg-surface-800 border border-surface-600 rounded-lg px-3 py-2 text-xs text-white font-mono placeholder-gray-600 focus:outline-none focus:border-icp-500"
                />
                <button
                  onClick={handleAdd}
                  disabled={busy === 'add' || !newPrincipal.trim()}
                  className="px-4 py-2 text-xs font-medium bg-icp-500 text-white rounded-lg hover:bg-icp-600 disabled:opacity-50 transition-colors"
                >
                  {busy === 'add' ? 'Adding…' : 'Add'}
                </button>
              </div>
              {error && <p className="text-[11px] text-red-400 mt-2">{error}</p>}
            </div>
            <div className="p-4 border-t border-surface-700 flex justify-end">
              <button onClick={onClose} className="px-4 py-2 text-sm text-gray-400 hover:text-white rounded-lg hover:bg-surface-800">Close</button>
            </div>
          </div>
        </div>
      );
    }

    // ---- Mint Cycles Modal ----
    function MintModal({ isOpen, onClose, icpBalance, cyclesBalance, onMinted }) {
      const [amount, setAmount] = useState('');
      const [unit, setUnit] = useState('icp'); // 'icp' or 'cycles'
      const [minting, setMinting] = useState(false);
      const [result, setResult] = useState(null);

      if (!isOpen) return null;

      const handleMint = async () => {
        if (!amount || isNaN(Number(amount)) || Number(amount) <= 0) return;
        setMinting(true);
        setResult(null);
        try {
          const data = await api.post('/api/cycles/mint', { amount, unit });
          setResult(data);
          if (data.ok) { setAmount(''); onMinted(); }
        } catch (e) {
          setResult({ ok: false, output: e.message });
        }
        setMinting(false);
      };

      return (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-surface-900 border border-surface-700 rounded-2xl w-full max-w-md shadow-2xl">
            <div className="p-5 border-b border-surface-700">
              <h3 className="text-base font-semibold text-white">Mint Cycles</h3>
              <p className="text-xs text-gray-500 mt-1">Convert ICP to cycles for your identity</p>
            </div>
            <div className="p-5 space-y-4">
              <div className="flex gap-2 text-xs">
                <span className="px-2 py-1 bg-surface-800 rounded text-icp-400 font-mono">{icpBalance ? parseFloat(icpBalance).toFixed(4) : '—'} ICP</span>
                <span className="px-2 py-1 bg-surface-800 rounded text-green-400 font-mono">{cyclesBalance ? (() => { const n = Number(cyclesBalance); return n >= 1e12 ? `${(n/1e12).toFixed(2)}T` : n >= 1e9 ? `${(n/1e9).toFixed(2)}B` : n.toLocaleString(); })() : '—'} cycles</span>
              </div>
              <div>
                <label className="block text-sm text-gray-400 mb-1.5">Amount</label>
                <div className="flex gap-2">
                  <input
                    type="text"
                    value={amount}
                    onChange={(e) => setAmount(e.target.value)}
                    placeholder={unit === 'icp' ? '0.5' : '1000000000000'}
                    className="flex-1 bg-surface-800 border border-surface-700 rounded-lg px-3 py-2 text-white text-sm font-mono focus:outline-none focus:border-icp-500"
                  />
                  <div className="flex bg-surface-800 border border-surface-700 rounded-lg overflow-hidden">
                    <button onClick={() => setUnit('icp')} className={`px-3 py-2 text-xs font-medium transition-colors ${unit === 'icp' ? 'bg-icp-500 text-white' : 'text-gray-400 hover:text-white'}`}>ICP</button>
                    <button onClick={() => setUnit('cycles')} className={`px-3 py-2 text-xs font-medium transition-colors ${unit === 'cycles' ? 'bg-green-500 text-white' : 'text-gray-400 hover:text-white'}`}>Cycles</button>
                  </div>
                </div>
                <p className="text-[11px] text-gray-600 mt-1.5">
                  {unit === 'icp' ? `Burns ${amount || '0'} ICP to mint cycles` : `Mints ${Number(amount || 0).toLocaleString()} cycles (ICP auto-calculated)`}
                </p>
              </div>
              {result && (
                <div className={`p-3 rounded-lg text-xs font-mono ${result.ok ? 'bg-green-500/10 text-green-400 border border-green-500/20' : 'bg-red-500/10 text-red-400 border border-red-500/20'}`}>
                  {result.output}
                </div>
              )}
            </div>
            <div className="p-4 border-t border-surface-700 flex justify-end gap-2">
              <button onClick={() => { onClose(); setAmount(''); setResult(null); }} className="px-4 py-2 text-sm text-gray-400 hover:text-white rounded-lg hover:bg-surface-800">Close</button>
              <button onClick={handleMint} disabled={minting || !amount} className="px-4 py-2 text-sm font-medium rounded-lg bg-icp-500 hover:bg-icp-600 text-white disabled:opacity-50 disabled:cursor-not-allowed">
                {minting ? 'Minting...' : 'Mint Cycles'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ---- Cycles Spending Modal ----
    function SpendingModal({ isOpen, onClose, topupHistory, network }) {
      const [period, setPeriod] = React.useState('month');
      const [view, setView] = React.useState('all'); // 'all' or canister name

      if (!isOpen) return null;

      const formatCyclesShort = (n) => {
        if (n >= 1e12) return `${(n / 1e12).toFixed(2)}T`;
        if (n >= 1e9) return `${(n / 1e9).toFixed(2)}B`;
        if (n >= 1e6) return `${(n / 1e6).toFixed(1)}M`;
        return n.toLocaleString();
      };

      // Filter to successful topups on current network
      const topups = topupHistory
        .filter((t) => t.success && t.network === network)
        .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

      // Get unique canister names
      const canisterNames = [...new Set(topups.map((t) => t.canister))].sort();

      // Filter by selected canister
      const filtered = view === 'all' ? topups : topups.filter((t) => t.canister === view);

      // Group by time period
      const getPeriodKey = (ts) => {
        const d = new Date(ts);
        if (period === 'week') {
          const start = new Date(d);
          start.setDate(start.getDate() - start.getDay());
          return `Week of ${start.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;
        }
        if (period === 'month') return d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
        if (period === 'quarter') return `Q${Math.floor(d.getMonth() / 3) + 1} ${d.getFullYear()}`;
        if (period === 'year') return String(d.getFullYear());
        return d.toLocaleDateString();
      };

      const grouped = {};
      for (const t of filtered) {
        const key = getPeriodKey(t.timestamp);
        if (!grouped[key]) grouped[key] = { cycles: 0n, count: 0, canisters: {} };
        const amt = BigInt(t.amount);
        grouped[key].cycles += amt;
        grouped[key].count += 1;
        if (!grouped[key].canisters[t.canister]) grouped[key].canisters[t.canister] = 0n;
        grouped[key].canisters[t.canister] += amt;
      }

      const periods = Object.entries(grouped);
      const totalCycles = filtered.reduce((sum, t) => sum + BigInt(t.amount), 0n);

      return (

    // ---- Top Up Modal (with source choice) ----
    function TopUpModal({ isOpen, canisterName, onClose, icpBalance, cyclesBalance, onTopUp }) {
      const [amount, setAmount] = useState('');
      const [source, setSource] = useState('cycles');

      if (!isOpen) return null;

      const formatBal = (c) => {
        if (!c) return '—';
        const n = Number(c);
        if (n >= 1e12) return `${(n/1e12).toFixed(2)}T`;
        if (n >= 1e9) return `${(n/1e9).toFixed(2)}B`;
        if (n >= 1e6) return `${(n/1e6).toFixed(1)}M`;
        return n.toLocaleString();
      };

      const handleSubmit = () => {
        if (!amount || isNaN(Number(amount)) || Number(amount) <= 0) return;
        onTopUp(canisterName, amount, source);
        setAmount('');
        onClose();
      };

      const presets = [
        { label: '100B', value: '100000000000' },
        { label: '500B', value: '500000000000' },
        { label: '1T', value: '1000000000000' },
        { label: '5T', value: '5000000000000' },
      ];

      return (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-surface-900 border border-surface-700 rounded-2xl w-full max-w-md shadow-2xl">
            <div className="p-5 border-b border-surface-700">
              <h3 className="text-base font-semibold text-white">Top Up "{canisterName}"</h3>
            </div>
            <div className="p-5 space-y-4">
              <div className="flex gap-2 text-xs">
                <span className="px-2 py-1 bg-surface-800 rounded text-icp-400 font-mono">{icpBalance ? parseFloat(icpBalance).toFixed(4) : '—'} ICP</span>
                <span className="px-2 py-1 bg-surface-800 rounded text-green-400 font-mono">{formatBal(cyclesBalance)} cycles</span>
              </div>
              <div>
                <label className="block text-sm text-gray-400 mb-1.5">Cycles Amount</label>
                <input
                  type="text"
                  value={amount}
                  onChange={(e) => setAmount(e.target.value)}
                  placeholder="e.g. 1000000000000 (1T)"
                  className="w-full bg-surface-800 border border-surface-700 rounded-lg px-3 py-2 text-white text-sm font-mono focus:outline-none focus:border-icp-500"
                />
                <div className="flex gap-1.5 mt-2">
                  {presets.map((p) => (
                    <button key={p.label} onClick={() => setAmount(p.value)} className="px-2 py-1 text-[11px] bg-surface-800 border border-surface-700 rounded text-gray-400 hover:text-white hover:border-icp-500/50 transition-colors font-mono">{p.label}</button>
                  ))}
                </div>
              </div>
              <div>
                <label className="block text-sm text-gray-400 mb-1.5">Pay From</label>
                <div className="flex gap-2">
                  <button onClick={() => setSource('cycles')} className={`flex-1 p-3 rounded-lg border text-left transition-colors ${source === 'cycles' ? 'border-green-500/50 bg-green-500/10' : 'border-surface-700 bg-surface-800 hover:border-surface-600'}`}>
                    <span className={`text-sm font-medium ${source === 'cycles' ? 'text-green-400' : 'text-gray-300'}`}>Cycles Balance</span>
                    <p className="text-[11px] text-gray-500 mt-0.5">{formatBal(cyclesBalance)} available</p>
                  </button>
                  <button onClick={() => setSource('icp')} className={`flex-1 p-3 rounded-lg border text-left transition-colors ${source === 'icp' ? 'border-icp-500/50 bg-icp-500/10' : 'border-surface-700 bg-surface-800 hover:border-surface-600'}`}>
                    <span className={`text-sm font-medium ${source === 'icp' ? 'text-icp-400' : 'text-gray-300'}`}>ICP (auto-mint)</span>
                    <p className="text-[11px] text-gray-500 mt-0.5">{icpBalance ? parseFloat(icpBalance).toFixed(4) : '—'} ICP available</p>
                  </button>
                </div>
                {source === 'icp' && (
                  <p className="text-[11px] text-yellow-400/80 mt-1.5">Will burn ICP to mint cycles, then top up the canister</p>
                )}
              </div>
            </div>
            <div className="p-4 border-t border-surface-700 flex justify-end gap-2">
              <button onClick={() => { onClose(); setAmount(''); }} className="px-4 py-2 text-sm text-gray-400 hover:text-white rounded-lg hover:bg-surface-800">Cancel</button>
              <button onClick={handleSubmit} disabled={!amount || isNaN(Number(amount)) || Number(amount) <= 0} className={`px-4 py-2 text-sm font-medium rounded-lg text-white disabled:opacity-50 disabled:cursor-not-allowed ${source === 'icp' ? 'bg-icp-500 hover:bg-icp-600' : 'bg-green-600 hover:bg-green-700'}`}>
                Top Up {amount ? formatBal(amount) : ''} cycles
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ---- Reinstall Confirm Modal (quadruple confirmation) ----

      const [typed, setTyped] = useState('');
      const REQUIRED_PHRASE = 'i will wipe all my app data';

      // Reset when opened/closed
      React.useEffect(() => {
        if (isOpen) { setStep(1); setTyped(''); }
      }, [isOpen]);

      if (!isOpen) return null;

      const isMainnet = network === 'ic';
      const stepContent = {
        1: {
          title: 'DANGER: Reinstall Mode Selected',
          body: (
            <div className="space-y-3">
              <div className="p-3 bg-red-500/10 border border-red-500/30 rounded-lg">
                <p className="text-sm text-red-300 font-semibold">Reinstall completely destroys all canister state.</p>
              </div>
              <p className="text-sm text-gray-400">This means:</p>
              <ul className="text-sm text-gray-400 list-disc list-inside space-y-1">
                <li>All stored data will be <span className="text-red-400 font-semibold">permanently erased</span></li>
                <li>All user accounts, balances, and records will be <span className="text-red-400 font-semibold">gone forever</span></li>
                <li>The canister will be wiped clean and re-initialized from scratch</li>
                <li>There is <span className="text-red-400 font-semibold">no undo</span></li>
              </ul>
              <p className="text-sm text-gray-500 mt-2">If you want to update your code while keeping data, use <span className="text-icp-400">Upgrade</span> mode instead.</p>
            </div>
          ),
          button: 'I understand the risk',
        },
        2: {
          title: 'Are you absolutely sure?',
          body: (
            <div className="space-y-3">
              <p className="text-sm text-gray-400">
                You are about to reinstall <span className="text-white font-semibold">{canisterCount} canister(s)</span>
                {isMainnet && <span className="text-red-400 font-semibold"> on MAINNET</span>}.
              </p>
              {isMainnet && (
                <div className="p-3 bg-red-500/10 border border-red-500/30 rounded-lg">
                  <p className="text-sm text-red-300 font-semibold">This is a PRODUCTION environment. Real users may be affected.</p>
                </div>
              )}
              <p className="text-sm text-gray-400">This action is <span className="text-red-400 font-semibold">irreversible</span>. No backup will be created automatically. If you have not taken a snapshot, your data is gone.</p>
            </div>
          ),
          button: 'Yes, I am sure',
        },
        3: {
          title: 'Final safety check',
          body: (
            <div className="space-y-3">
              <p className="text-sm text-gray-400">Type the following phrase exactly to proceed:</p>
              <div className="p-3 bg-surface-800 border border-surface-700 rounded-lg">
                <p className="text-sm text-white font-mono text-center select-none">{REQUIRED_PHRASE}</p>
              </div>
              <input
                type="text"
                value={typed}
                onChange={(e) => setTyped(e.target.value)}
                placeholder="Type the phrase above..."
                className="w-full px-3 py-2.5 bg-surface-950 border border-surface-700 rounded-lg text-sm text-white placeholder-gray-600 focus:outline-none focus:border-red-500"
                autoFocus
              />
              {typed.length > 0 && typed.toLowerCase() !== REQUIRED_PHRASE && (
                <p className="text-xs text-red-400">Phrase does not match.</p>
              )}
            </div>
          ),
          button: 'Proceed to final confirmation',
          disabled: typed.toLowerCase() !== REQUIRED_PHRASE,
        },
        4: {
          title: 'LAST CHANCE — Point of no return',
          body: (
            <div className="space-y-3">
              <div className="p-4 bg-red-500/15 border-2 border-red-500/40 rounded-lg text-center">
                <p className="text-red-400 font-bold text-base">ALL DATA WILL BE PERMANENTLY DESTROYED</p>
                <p className="text-red-300/80 text-sm mt-1">{canisterCount} canister(s){isMainnet ? ' on MAINNET' : ''}</p>
              </div>
              <p className="text-sm text-gray-500 text-center">Click the button below to execute the reinstall. This is your last chance to cancel.</p>
            </div>

          button: 'WIPE DATA AND REINSTALL',

      };

      const current = stepContent[step];

      return (
        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-surface-900 border-2 border-red-500/40 rounded-2xl w-full max-w-lg shadow-2xl">
            {/* Step indicator */}
            <div className="px-5 pt-4 flex items-center gap-1.5">
              {[1,2,3,4].map((s) => (
                <div key={s} className={`h-1 flex-1 rounded-full transition-colors ${s <= step ? 'bg-red-500' : 'bg-surface-700'}`} />

                  }`}
                >
                  {current.button}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ---- Snapshots Tab ----
    function SnapshotsTab({ projectPath, projectLoaded, network, canisters, addToast }) {
      const networkLabel = network === 'ic' ? 'Production' : network === 'local' ? 'Local' : network.charAt(0).toUpperCase() + network.slice(1);
      const [selectedCanister, setSelectedCanister] = useState('');
      const [snapshots, setSnapshots] = useState([]);
      const [loading, setLoading] = useState(false);
      const [actionLoading, setActionLoading] = useState(null); // 'create' | 'load:ID' | 'delete:ID' | 'download:ID' | 'upload'
      const [message, setMessage] = useState(null); // { type: 'success'|'error'|'info', text }
      const [downloadDir, setDownloadDir] = useState('');
      const [uploadDir, setUploadDir] = useState('');
      const [showDownloadInput, setShowDownloadInput] = useState(null); // snapshot ID
      const [showUploadInput, setShowUploadInput] = useState(false);
      const [confirmAction, setConfirmAction] = useState(null);
      const [canisterStatus, setCanisterStatus] = useState(null); // 'Running' | 'Stopped' | null
      const [metadata, setMetadata] = useState(null);

      // Auto-select first canister
      useEffect(() => {
        if (canisters.length > 0 && !selectedCanister) {
          setSelectedCanister(canisters[0].name);
        }
      }, [canisters]);

      // Fetch snapshots + status when canister changes
      const fetchSnapshots = useCallback(async () => {
        if (!selectedCanister || !projectPath) return;
        setLoading(true);
        setMessage(null);
        try {
          const [snapData, statusData] = await Promise.all([
            api.post('/api/canister/snapshots', { path: projectPath, canister: selectedCanister, network }),
            api.post('/api/canister/status', { path: projectPath, canister: selectedCanister, network }),
          ]);
          if (snapData.error) {
            const notDeployed = snapData.error.includes('Cannot find canister id');
            setMessage({ type: notDeployed ? 'warn' : 'error', text: notDeployed ? `Not deployed on ${network === 'ic' ? 'production' : network === 'local' ? 'local replica' : network} — deploy first to use snapshots.` : snapData.error });
            setSnapshots([]);
          } else {
            setSnapshots(snapData.snapshots || []);
          }
          setCanisterStatus(statusData.runningStatus || null);
        } catch (e) {
          setMessage({ type: 'error', text: e.message });
        }
        setLoading(false);
      }, [selectedCanister, projectPath, network]);

      useEffect(() => {
        if (selectedCanister && projectPath) fetchSnapshots();
      }, [selectedCanister, projectPath, network]);

      // Actions — all wrapped in try/catch to prevent stuck loading states
      const createSnapshot = async () => {
        setActionLoading('create');
        setMessage(null);
        try {
          // Use safe-create: automatically stops → snapshots → restarts
          if (isRunning) setMessage({ type: 'info', text: 'Stopping canister...' });
          const data = await api.post('/api/canister/snapshot/safe-create', {
            path: projectPath, canister: selectedCanister, network,
          });
          if (data.ok) {
            const parts = [`Snapshot created${data.snapshotId ? ': ' + data.snapshotId : ''}`];
            if (data.steps?.stopped) parts.push('(auto-stopped');
            if (data.steps?.restarted) parts[parts.length - 1] += ' and restarted)';
            else if (data.steps?.stopped) parts[parts.length - 1] += ')';
            setMessage({ type: 'success', text: parts.join(' ') });
            if (addToast) addToast('Snapshot created', 'success');
            fetchSnapshots();
          } else {
            let errText = data.error || 'Failed to create snapshot';
            if (data.steps?.stopped && !data.steps?.restarted) {
              errText += ' — WARNING: canister may still be stopped, check Canisters tab';
            }
            setMessage({ type: 'error', text: errText });
          }
        } catch (e) {
          setMessage({ type: 'error', text: e.message });
        }
        setActionLoading(null);
      };

      const loadSnapshot = async (snapshotId) => {
        setActionLoading('load:' + snapshotId);
        setMessage(null);
        try {
          const data = await api.post('/api/canister/snapshot/load', {
            path: projectPath, canister: selectedCanister, network, snapshotId,
          });
          if (data.ok) {
            setMessage({ type: 'success', text: 'Snapshot restored successfully' });
            if (addToast) addToast('Snapshot restored', 'success');
            fetchSnapshots();
          } else {
            setMessage({ type: 'error', text: data.output || 'Failed to load snapshot' });
          }
        } catch (e) {
          setMessage({ type: 'error', text: e.message });
        }
        setActionLoading(null);
      };

      const deleteSnapshot = async (snapshotId) => {
        setActionLoading('delete:' + snapshotId);
        setMessage(null);
        try {
          const data = await api.post('/api/canister/snapshot/delete', {
            path: projectPath, canister: selectedCanister, network, snapshotId,
          });
          if (data.ok) {
            setMessage({ type: 'success', text: 'Snapshot deleted' });
            if (addToast) addToast('Snapshot deleted', 'success');
            fetchSnapshots();
          } else {
            setMessage({ type: 'error', text: data.output || 'Failed to delete snapshot' });
          }
        } catch (e) {
          setMessage({ type: 'error', text: e.message });
        }
        setActionLoading(null);
      };

      const downloadSnapshot = async (snapshotId) => {
        if (!downloadDir) { setMessage({ type: 'error', text: 'Enter a directory path' }); return; }
        setActionLoading('download:' + snapshotId);
        setMessage({ type: 'info', text: 'Downloading snapshot... this may take a while for large canisters' });
        try {
          const data = await api.post('/api/canister/snapshot/download', {
            path: projectPath, canister: selectedCanister, network, snapshotId, dir: downloadDir,
          });
          if (data.ok) {
            setMessage({ type: 'success', text: `Snapshot downloaded to ${downloadDir}` });
            setShowDownloadInput(null);
          } else {
            setMessage({ type: 'error', text: data.error || 'Download failed' });
          }
        } catch (e) {
          setMessage({ type: 'error', text: e.message });
        }
        setActionLoading(null);
      };

      const uploadSnapshot = async () => {
        if (!uploadDir) { setMessage({ type: 'error', text: 'Enter a directory path' }); return; }
        setActionLoading('upload');
        setMessage({ type: 'info', text: 'Uploading snapshot... this may take a while' });
        try {
          const data = await api.post('/api/canister/snapshot/upload', {
            path: projectPath, canister: selectedCanister, network, dir: uploadDir,
          });
          if (data.ok) {
            setMessage({ type: 'success', text: `Snapshot uploaded${data.snapshotId ? ': ' + data.snapshotId : ''}` });
            setShowUploadInput(false);
            fetchSnapshots();
          } else {
            setMessage({ type: 'error', text: data.error || 'Upload failed' });
          }
        } catch (e) {
          setMessage({ type: 'error', text: e.message });
        }
        setActionLoading(null);
      };

      const fetchMetadata = async (name) => {
        setMetadata(null);
        try {
          const data = await api.post('/api/canister/metadata', {
            path: projectPath, canister: selectedCanister, network, metadataName: name,
          });
          if (data.ok) {
            setMetadata({ name, data: data.data });
          } else {
            setMetadata({ name, error: data.error });
          }
        } catch (e) {
          setMetadata({ name, error: e.message });
        }
      };

      const isStopped = canisterStatus === 'Stopped';
      const isRunning = canisterStatus === 'Running';

      if (!projectLoaded) {
        return (
          <div className="bg-surface-900 border border-surface-700 rounded-2xl px-5 py-12 text-center text-gray-500">
            <p>Load a project to manage snapshots</p>
          </div>
        );
      }

      return (
        <div className="space-y-5">
          {/* Header */}
          <div className="flex items-center justify-between">
            <div>
              <h2 className="text-base font-semibold text-white">Snapshots & Data</h2>
              <p className="text-sm text-gray-500 mt-0.5">
                Backup, restore, and extract canister data — {networkLabel}
              </p>
            </div>
          </div>

          {/* Canister selector + status */}
          <div className="flex flex-col sm:flex-row gap-3">
            <div className="flex-1">
              <label className="block text-xs text-gray-500 mb-1.5">Canister</label>
              <select
                value={selectedCanister}
                onChange={(e) => { setSelectedCanister(e.target.value); setSnapshots([]); setMessage(null); setMetadata(null); }}
                className="w-full bg-surface-800 border border-surface-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-icp-500 text-sm appearance-none cursor-pointer"
              >
                {canisters.map((c) => (
                  <option key={c.name} value={c.name}>{c.name} ({c.type})</option>
                ))}
              </select>
            </div>
            <div className="flex items-end gap-2">
              {canisterStatus && (
                <div className={`px-3 py-3 rounded-xl text-xs font-medium flex items-center gap-2 ${
                  isStopped ? 'bg-red-500/10 text-red-400 border border-red-500/20'
                    : isRunning ? 'bg-green-500/10 text-green-400 border border-green-500/20'
                    : 'bg-gray-500/10 text-gray-400 border border-gray-500/20'
                }`}>
                  <div className={`w-1.5 h-1.5 rounded-full ${isStopped ? 'bg-red-400' : isRunning ? 'bg-green-400' : 'bg-gray-400'}`} />
                  {canisterStatus}
                </div>
              )}
              <button onClick={fetchSnapshots} disabled={loading} className="px-4 py-3 bg-surface-800 border border-surface-700 rounded-xl text-sm text-gray-300 hover:bg-surface-700 transition-colors disabled:opacity-50">
                {loading ? <SpinnerIcon className="w-4 h-4" /> : 'Refresh'}

              <svg className="w-4 h-4 text-icp-400 mt-0.5 shrink-0" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z" />

          {message && (
            <div className={`flex items-start gap-2 p-3 rounded-xl text-xs ${
              message.type === 'success' ? 'bg-green-500/10 border border-green-500/20 text-green-300' :
              message.type === 'error' ? 'bg-red-500/10 border border-red-500/20 text-red-300' :
              message.type === 'warn' ? 'bg-yellow-500/10 border border-yellow-500/20 text-yellow-300' :
              'bg-icp-500/10 border border-icp-500/20 text-icp-300'
            }`}>
              {message.type === 'info' && <SpinnerIcon className="w-3.5 h-3.5 shrink-0 mt-0.5" />}
              <p className="break-all">{message.text}</p>
              <button onClick={() => setMessage(null)} className="ml-auto text-gray-500 hover:text-white shrink-0">&times;</button>
            </div>
          )}

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
            {/* Left: Snapshot actions */}
            <div className="space-y-4">
              {/* Create snapshot */}
              <div className="bg-surface-900 border border-surface-700 rounded-2xl p-5">
                <h3 className="text-sm font-medium text-white mb-3">Create Snapshot</h3>
                <p className="text-[11px] text-gray-500 mb-3">Saves canister WASM, heap, stable memory, and all data. Max 10 per canister.</p>
                <button
                  onClick={createSnapshot}
                  disabled={!!actionLoading}
                  className="w-full py-2.5 bg-icp-500/10 text-icp-400 border border-icp-500/20 rounded-xl text-sm font-medium hover:bg-icp-500/20 disabled:opacity-40 transition-colors flex items-center justify-center gap-2"
                >
                  {actionLoading === 'create' ? <><SpinnerIcon className="w-4 h-4" /> {isRunning ? 'Stopping & snapshotting...' : 'Creating...'}</> : (
                    <><svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z" /><path strokeLinecap="round" strokeLinejoin="round" d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0ZM18.75 10.5h.008v.008h-.008V10.5Z" /></svg> Create Snapshot</>

                </button>
                <p className="text-[10px] text-gray-600 mt-2 text-center">{snapshots.length}/10 snapshots used</p>
              </div>

              {/* Upload snapshot */}
              <div className="bg-surface-900 border border-surface-700 rounded-2xl p-5">
                <h3 className="text-sm font-medium text-white mb-3">Upload Snapshot</h3>

                        disabled={!uploadDir || !!actionLoading || isRunning}
                        className="flex-1 py-2 bg-icp-500/10 text-icp-400 border border-icp-500/20 rounded-lg text-xs font-medium hover:bg-icp-500/20 disabled:opacity-40 transition-colors flex items-center justify-center gap-1"
                      >
                        {actionLoading === 'upload' ? <><SpinnerIcon className="w-3 h-3" /> Uploading...</> : 'Upload'}
                      </button>
                      <button onClick={() => setShowUploadInput(false)} className="px-3 py-2 text-xs text-gray-500 hover:text-white">Cancel</button>
                    </div>
                  </div>
                ) : (
                  <button
                    onClick={() => setShowUploadInput(true)}
                    disabled={!!actionLoading || isRunning}
                    className="w-full py-2.5 bg-surface-800 text-gray-300 border border-surface-700 rounded-xl text-sm font-medium hover:bg-surface-700 disabled:opacity-40 transition-colors flex items-center justify-center gap-2"
                  >
                    <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" /></svg>
                    Upload from Directory
                  </button>
                )}
              </div>

              {/* Data extraction */}
              <div className="bg-surface-900 border border-surface-700 rounded-2xl p-5">
                <h3 className="text-sm font-medium text-white mb-3">Extract Data</h3>
                <p className="text-[11px] text-gray-500 mb-3">Read canister metadata like Candid interfaces.</p>
                <div className="space-y-2">
                  {['candid:service', 'candid:args', 'dfx'].map((name) => (
                    <button
                      key={name}
                      onClick={() => fetchMetadata(name)}

                      {name}
                    </button>
