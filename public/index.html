                  </div>

                  {/* Open Live App */}
                  {network === 'ic' && (() => {
                    const fc = canisters.find(c => c.type === 'assets' || c.name.includes('frontend') || c.name.includes('asset'));
                    if (!fc) return null;
                    const cid = deploySummary?.canisters?.[fc.name]?.canisterId || canisterStatuses[fc.name]?.canisterId;
                    if (!cid || !isValidCanisterId(cid)) return null;
                    return (
                      <a
                        href={`https://${cid}.icp0.io`}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="mt-3 w-full flex items-center justify-center gap-2 py-3 bg-surface-900 border border-icp-500/30 rounded-2xl text-icp-400 hover:bg-icp-500/10 hover:border-icp-500/50 transition-colors font-medium text-sm"
                      >
                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor">
                          <path strokeLinecap="round" strokeLinejoin="round" d="M13.5 6H5.25A2.25 2.25 0 0 0 3 8.25v10.5A2.25 2.25 0 0 0 5.25 21h10.5A2.25 2.25 0 0 0 18 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" />
                        </svg>
                        Open Live App
                      </a>
                    );
                  })()}
                </div>

                {/* Right: Summary + Logs */}
                <div className="lg:col-span-2">
                  <div className="bg-surface-950 border border-surface-700 rounded-2xl overflow-hidden h-full flex flex-col">
                    <div className="px-4 py-3 border-b border-surface-700 flex items-center justify-between bg-surface-900">
                      <div className="flex items-center gap-2">
                        <div className="flex gap-1.5">
                          <div className="w-3 h-3 rounded-full bg-red-500/60" />
                          <div className="w-3 h-3 rounded-full bg-yellow-500/60" />
                          <div className="w-3 h-3 rounded-full bg-green-500/60" />
                        </div>
                        <div className="flex gap-1 ml-2">
                          <button onClick={() => setRightPanel('summary')} className={`text-xs px-2 py-0.5 rounded ${rightPanel === 'summary' ? 'bg-surface-700 text-white' : 'text-gray-500 hover:text-gray-300'}`}>Summary</button>
                          <button onClick={() => setRightPanel('logs')} className={`text-xs px-2 py-0.5 rounded ${rightPanel === 'logs' ? 'bg-surface-700 text-white' : 'text-gray-500 hover:text-gray-300'}`}>
                            Logs {logs.length > 0 && <span className="ml-1 text-[10px] bg-icp-500/30 text-icp-300 px-1.5 py-0 rounded-full">{logs.length}</span>}
                          </button>
                        </div>
                      </div>
                      {rightPanel === 'logs' && (
                        <button onClick={() => setLogs([])} className="text-xs text-gray-500 hover:text-gray-300">Clear</button>
                      )}
                      {rightPanel === 'summary' && projectLoaded && (
                        <button onClick={fetchDeploySummary} disabled={summaryLoading} className="text-xs text-icp-400 hover:text-icp-300 flex items-center gap-1">
                          {summaryLoading ? <SpinnerIcon className="w-3 h-3" /> : <svg className="w-3 h-3" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182" /></svg>}
                          Refresh
                        </button>
                      )}
                    </div>
                    <div className="log-container flex-1 p-4 overflow-y-auto min-h-[500px] max-h-[700px]">
                      {rightPanel === 'logs' ? (
                        <>
                          {logs.length === 0 ? (
                            <p className="text-gray-600 text-sm">Deploy output will appear here...</p>
                          ) : (
                            logs.map((log, i) => (
                              <div key={i} className={`whitespace-pre-wrap mb-0.5 leading-relaxed ${log.type === 'error' ? 'text-red-400' : log.type === 'info' ? 'text-icp-400' : 'text-gray-300'}`}>{log.text}</div>
                            ))
                          )}
                          <div ref={logEndRef} />
                        </>
                      ) : (
                        <DeploySummaryView summary={deploySummary} loading={summaryLoading} network={network} projectLoaded={projectLoaded} canisterConfigs={canisters} />
                      )}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {tab === 'canisters' && (
              <div className="space-y-4">
                {/* Header bar */}
                <div className="flex items-center justify-between">
                  <div>
                    <h2 className="text-base font-semibold text-white">Canister Status</h2>
                    <p className="text-sm text-gray-500 mt-0.5">
                      {projectLoaded
                        ? `${ownedCanisters.length} canister(s) — ${networkLabel}`
                        : 'Load a project to view canisters'}
                    </p>
                  </div>
                  {projectLoaded && ownedCanisters.length > 0 && (
                    <button
                      onClick={fetchAllCanisterStatuses}
                      disabled={loadingStatuses}
                      className="flex items-center gap-2 px-4 py-2 bg-icp-500/10 text-icp-400 border border-icp-500/20 rounded-xl text-sm font-medium hover:bg-icp-500/20 disabled:opacity-50 transition-colors"
                    >
                      {loadingStatuses ? (
                        <><SpinnerIcon className="w-4 h-4" /> Fetching...</>
                      ) : (
                        <><svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182" /></svg> Refresh All</>
                      )}
                    </button>
                  )}
                </div>

                {/* Network indicator */}
                <div className={`flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm ${
                  network === 'ic'
                    ? 'bg-orange-500/10 border border-orange-500/20 text-orange-300'
                    : 'bg-icp-500/10 border border-icp-500/20 text-icp-300'
                }`}>
                  <div className={`w-2 h-2 rounded-full ${network === 'ic' ? 'bg-orange-400' : 'bg-icp-400'}`} />
                  Showing {networkLabel.toLowerCase()} canister status
                </div>

                {/* Canister cards */}
                {canisters.length > 0 ? (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {canisters.map((c) => {
                      // Check if canister is remote/external on the current network
                      const isRemote = isRemoteForNetwork(c, network);
                      const remoteId = c.remote?.id?.[network] || c.remote?.id?.ic || c.remote?.id?.local || null;

                      if (isRemote) {
                        const es = canisterStatuses[c.name];
                        const extCanisterId = es?.canisterId || remoteId;
                        // Hide externally owned canisters if they have no canister ID on this network
                        if (!extCanisterId) return null;
                        const extRunning = es?.runningStatus === 'Running';
                        const extStopped = es?.runningStatus === 'Stopped';
                        const extHasStatus = es && !es.error && !es.loading;
                        return (
                          <div key={c.name} className="bg-surface-900 border border-surface-700 rounded-2xl overflow-hidden opacity-75">
                            <div className="px-5 py-4">
                              <div className="flex items-center justify-between mb-1">
                                <div className="flex items-center gap-2">
                                  <span className="text-base font-semibold text-white">{c.name}</span>
                                  <span className="text-[10px] px-2 py-0.5 rounded-full font-medium bg-purple-500/20 text-purple-300 border border-purple-500/20">Externally Owned</span>
                                </div>
                                {es?.loading && <SpinnerIcon className="w-4 h-4 text-gray-500" />}
                                {extHasStatus && (
                                  <span className={`text-xs font-medium flex items-center gap-1.5 ${extRunning ? 'text-green-400' : extStopped ? 'text-red-400' : 'text-gray-400'}`}>
                                    <span className={`w-1.5 h-1.5 rounded-full ${extRunning ? 'bg-green-400' : extStopped ? 'bg-red-400' : 'bg-gray-400'}`} />
                                    {es.runningStatus}
                                  </span>
                                )}
                              </div>
                              <p className="text-xs text-gray-500 font-mono mt-1">{extCanisterId}</p>
                              {extHasStatus && es.moduleHash && es.moduleHash !== 'None' && (
                                <p className="text-[11px] text-gray-600 mt-1.5 font-mono">Module: {es.moduleHash.slice(0, 18)}...</p>
                              )}
                              <p className="text-xs text-gray-600 mt-2">Externally owned canister — not controlled by your identity.</p>
                            </div>
                          </div>
                        );
                      }

                      const s = canisterStatuses[c.name];
                      const hasData = s && !s.error && !s.loading;
                      const isRunning = s?.runningStatus === 'Running';
                      const isStopped = s?.runningStatus === 'Stopped';
                      let cycles = null;
                      if (hasData && s.cycles) {
                        try { cycles = BigInt(s.cycles.replace(/[^0-9]/g, '')); } catch {}
                      }

                      const formatCycles = (c) => {
                        if (!c) return '—';
                        const n = Number(c);
                        if (n >= 1e12) return `${(n / 1e12).toFixed(2)}T`;
                        if (n >= 1e9) return `${(n / 1e9).toFixed(2)}B`;
                        if (n >= 1e6) return `${(n / 1e6).toFixed(1)}M`;
                        return n.toLocaleString();
                      };

                      const getCyclesHealth = (c) => {
                        if (!c) return 'unknown';
                        const n = Number(c);
                        if (n >= 1e12) return 'great';
                        if (n >= 1e11) return 'good';
                        if (n >= 1e10) return 'low';
                        return 'critical';
                      };

                      const health = getCyclesHealth(cycles);
                      const healthColors = { great: 'text-green-400', good: 'text-blue-400', low: 'text-yellow-400', critical: 'text-red-400', unknown: 'text-gray-500' };
                      const healthBarColors = { great: 'bg-green-400', good: 'bg-blue-400', low: 'bg-yellow-400', critical: 'bg-red-400', unknown: 'bg-gray-600' };
                      const healthBarWidth = { great: 'w-full', good: 'w-3/4', low: 'w-1/3', critical: 'w-[10%]', unknown: 'w-0' };

                      // Freezing threshold check (default 30 days = 2,592,000 seconds)
                      const freezeThreshold = hasData && s.freezingThreshold ? Number(s.freezingThreshold) : null;
                      const freezeDays = freezeThreshold ? (freezeThreshold / 86400).toFixed(0) : null;
                      const freezeWarning = freezeThreshold !== null && freezeThreshold < 7776000; // < 90 days

                      // Controller warnings
                      const controllers = hasData && s.controllers ? s.controllers : [];
                      const singleController = controllers.length === 1;
                      const isMyCanister = !principal || controllers.length === 0 || controllers.includes(principal);
                      const notMine = hasData && controllers.length > 0 && principal && !controllers.includes(principal);

                      return (
                        <div key={c.name} className={`bg-surface-900 border rounded-2xl overflow-hidden ${notMine ? 'border-surface-700/50 opacity-70' : 'border-surface-700'}`}>
                          {/* Card header */}
                          <div className="px-5 py-4 flex items-start justify-between">
                            <div className="flex-1 min-w-0">
                              <div className="flex items-center gap-2">
                                <span className="text-base font-semibold text-white">{c.name}</span>
                                {notMine && (
                                  <span className="text-[10px] px-2 py-0.5 rounded-full font-medium bg-gray-500/20 text-gray-400 border border-gray-500/20">Not your controller</span>
                                )}
                                <span className={`text-[11px] px-2 py-0.5 rounded-full font-medium ${
                                  c.type === 'motoko' ? 'bg-purple-500/20 text-purple-300' :
                                  c.type === 'rust' ? 'bg-orange-500/20 text-orange-300' :
                                  c.type === 'assets' ? 'bg-blue-500/20 text-blue-300' :
                                  c.type === 'custom' ? 'bg-amber-500/20 text-amber-300' :
                                  'bg-gray-500/20 text-gray-300'
                                }`}>{c.type}</span>
                              </div>
                              {s?.canisterId && (
                                <div className="flex items-center gap-2 mt-1">
                                  <p className="text-xs text-gray-500 font-mono truncate" title={s.canisterId}>{s.canisterId}</p>
                                  {network === 'ic' && s.canisterId && isValidCanisterId(s.canisterId) && (
                                    <a
                                      href={`https://${s.canisterId}.icp0.io`}
                                      target="_blank"
                                      rel="noopener noreferrer"
                                      className="text-[10px] px-1.5 py-0.5 bg-icp-500/10 text-icp-400 border border-icp-500/20 rounded hover:bg-icp-500/20 transition-colors shrink-0"
                                      title={`Open https://${s.canisterId}.icp0.io`}
                                    >Open</a>
                                  )}
                                  {network === 'ic' && s.canisterId && isValidCanisterId(s.canisterId) && (
                                    <a
                                      href={`https://dashboard.internetcomputer.org/canister/${s.canisterId}`}
                                      target="_blank"
                                      rel="noopener noreferrer"
                                      className="text-[10px] px-1.5 py-0.5 bg-surface-800 text-gray-500 border border-surface-700 rounded hover:text-gray-300 transition-colors shrink-0"
                                      title="View on ICP Dashboard"
                                    >Dashboard</a>
                                  )}
                                </div>
                              )}
                              {!s?.canisterId && hasData && (
                                <p className="text-xs text-gray-600 mt-1">No canister ID</p>
                              )}
                            </div>
                            <div className="flex items-center gap-2">
                              {hasData && (
                                <div className={`flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-medium ${
                                  isRunning ? 'bg-green-500/10 text-green-400 border border-green-500/20'
                                    : isStopped ? 'bg-red-500/10 text-red-400 border border-red-500/20'
                                    : 'bg-gray-500/10 text-gray-400 border border-gray-500/20'
                                }`}>
                                  <div className={`w-1.5 h-1.5 rounded-full ${isRunning ? 'bg-green-400' : isStopped ? 'bg-red-400' : 'bg-gray-400'}`} />
                                  {s.runningStatus}
                                </div>
                              )}
                              {s?.loading && <SpinnerIcon className="w-4 h-4 text-gray-500" />}
                            </div>
                          </div>

                          {/* Cycles section */}
                          <div className="px-5 pb-4">
                            {hasData && cycles !== null ? (
                              <div>
                                <div className="flex items-baseline justify-between mb-2">
                                  <span className="text-xs text-gray-500">Cycles Balance</span>
                                  <span className={`text-lg font-bold ${healthColors[health]}`}>{formatCycles(cycles)}</span>
                                </div>
                                <div className="h-2 bg-surface-800 rounded-full overflow-hidden">
                                  <div className={`h-full rounded-full transition-all duration-500 ${healthBarColors[health]} ${healthBarWidth[health]}`} />
                                </div>
                                <div className="flex items-center justify-between mt-1.5">
                                  <span className={`text-[11px] ${healthColors[health]}`}>
                                    {health === 'great' ? 'Healthy' : health === 'good' ? 'Good' : health === 'low' ? 'Running low — top up soon' : 'Critical — canister may freeze!'}
                                  </span>
                                  <span className="text-[11px] text-gray-600">{Number(cycles).toLocaleString()} cycles</span>
                                </div>
                              </div>
                            ) : s?.error ? (
                              (s.error.includes('Cannot find canister id') || s.error.includes('failed to lookup canister ID') || s.error.includes('could not find ID')) ? (
                                <div className="p-4 bg-surface-800/50 border border-surface-700 rounded-xl text-center">
                                  <svg className="w-6 h-6 text-gray-600 mx-auto mb-2" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" d="M20.25 6.375c0 2.278-3.694 4.125-8.25 4.125S3.75 8.653 3.75 6.375m16.5 0c0-2.278-3.694-4.125-8.25-4.125S3.75 4.097 3.75 6.375m16.5 0v11.25c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125V6.375m16.5 0v3.75m-16.5-3.75v3.75m16.5 0v3.75C20.25 16.153 16.556 18 12 18s-8.25-1.847-8.25-4.125v-3.75m16.5 0c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125" />
                                  </svg>
                                  <p className="text-sm text-gray-400 font-medium">Not deployed</p>
                                  <p className="text-[11px] text-gray-600 mt-1">This canister doesn't exist on {network === 'ic' ? 'production' : network === 'local' ? 'local replica' : network} yet. Deploy it from the Deploy tab.</p>
                                </div>
                              ) : (
                                <div className="flex items-start gap-2 p-3 bg-red-500/5 border border-red-500/10 rounded-xl">
                                  <svg className="w-4 h-4 text-red-400 mt-0.5 shrink-0" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
                                  </svg>
                                  <p className="text-xs text-red-300 break-all">{s.error.length > 120 ? s.error.slice(0, 120) + '...' : s.error}</p>
                                </div>
                              )
                            ) : !s ? (
                              <button onClick={() => fetchCanisterStatus(c.name)} className="w-full py-2.5 text-xs bg-surface-800 text-gray-400 rounded-xl hover:bg-surface-700 border border-surface-700 transition-colors">Load status</button>
                            ) : null}
                          </div>

                          {/* Top-up history */}
                          {(() => {
                            const canisterTopups = topupHistory
                              .filter((t) => t.canister === c.name && t.network === network)
                              .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                            if (canisterTopups.length === 0) return null;
                            const recent = canisterTopups.slice(0, 3);
                            return (
                              <div className="px-5 pb-3">
                                <span className="text-[11px] text-gray-500 font-medium">Top-up History</span>
                                <div className="mt-1 space-y-1">
                                  {recent.map((t, i) => (
                                    <div key={i} className="flex items-center justify-between text-[11px]">
                                      <span className="text-gray-500">{new Date(t.timestamp).toLocaleDateString()}</span>
                                      <span className={t.success ? 'text-green-400' : 'text-red-400'}>
                                        {t.success ? '+' : 'Failed '}{formatCycles(BigInt(t.amount))}
                                      </span>
                                    </div>
                                  ))}
                                  {canisterTopups.length > 3 && (
                                    <span className="text-[10px] text-gray-600">+{canisterTopups.length - 3} more</span>
                                  )}
                                </div>
                              </div>
                            );
                          })()}

                          {/* Warnings */}
                          {(() => {
                            const cid = s?.canisterId;
                            const ledgerBal = cid ? cyclesLedgerBalances[cid] : null;
                            const hasLedgerBalance = ledgerBal && ledgerBal !== '0' && Number(ledgerBal) > 0;
                            if (!hasData && !hasLedgerBalance) return null;
                            if (!hasLedgerBalance && !(health === 'critical' || (singleController && isMyCanister) || freezeWarning || notMine)) return null;
                            return (
                            <div className="px-5 pb-3 space-y-1.5">
                              {hasLedgerBalance && (
                                <div className="flex items-center gap-2 p-2 bg-amber-500/10 border border-amber-500/20 rounded-lg">
                                  <svg className="w-3.5 h-3.5 text-amber-400 shrink-0" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" d="M12 6v12m-3-2.818.879.659c1.171.879 3.07.879 4.242 0 1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12 12c-.725 0-1.45-.22-2.003-.659-1.106-.879-1.106-2.303 0-3.182s2.9-.879 4.006 0l.415.33M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg>
                                  <span className="text-[11px] text-amber-300">{formatCycles(BigInt(ledgerBal))} cycles held on the cycles ledger under this canister's principal — consider withdrawing or using them</span>
                                </div>
                              )}
                              {notMine && (
                                <div className="flex items-center gap-2 p-2 bg-gray-500/10 border border-gray-500/20 rounded-lg">
                                  <svg className="w-3.5 h-3.5 text-gray-400 shrink-0" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" /></svg>
                                  <span className="text-[11px] text-gray-400">You are not a controller of this canister. Management actions are unavailable.</span>
                                </div>
                              )}
                              {health === 'critical' && isMyCanister && (
                                <div className="flex items-center gap-2 p-2 bg-red-500/10 border border-red-500/20 rounded-lg">
                                  <svg className="w-3.5 h-3.5 text-red-400 shrink-0" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" /></svg>
                                  <span className="text-[11px] text-red-300">Canister will freeze and become inaccessible if cycles reach zero</span>
                                </div>
                              )}
                              {singleController && isMyCanister && network === 'ic' && (
                                <div className="flex items-center gap-2 p-2 bg-yellow-500/10 border border-yellow-500/20 rounded-lg">
                                  <svg className="w-3.5 h-3.5 text-yellow-400 shrink-0" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" /></svg>
                                  <span className="text-[11px] text-yellow-300">Single controller — add a backup to prevent lockout</span>
                                </div>
                              )}
                              {freezeWarning && isMyCanister && network === 'ic' && (
                                <div className="flex items-center gap-2 p-2 bg-yellow-500/10 border border-yellow-500/20 rounded-lg">
                                  <svg className="w-3.5 h-3.5 text-yellow-400 shrink-0" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" /></svg>
                                  <span className="text-[11px] text-yellow-300">Freezing threshold is {freezeDays} days — recommended 90+ for production</span>
                                </div>
                              )}
                            </div>
                            );
                          })()}

                          {/* Extra info footer */}
                          {hasData && (
                            <div className="px-5 py-3 border-t border-surface-800 bg-surface-950/50">
                              <div className="flex flex-wrap gap-x-4 gap-y-1">
                                {s.memoryBytes && (
                                  <span className="text-[11px] text-gray-500">Memory: {(Number(s.memoryBytes) / (1024 * 1024)).toFixed(1)} MB</span>
                                )}
                                {freezeDays && (
                                  <span className="text-[11px] text-gray-500">Freeze threshold: {freezeDays}d</span>
                                )}
                                {s.version ? (
                                  <span className="text-[11px] text-icp-400 font-mono" title={s.moduleHash}>
                                    {s.version.gitCommit}{s.version.gitBranch ? ` (${s.version.gitBranch})` : ''}{s.version.gitDirty ? ' *dirty*' : ''}
                                    {s.version.timestamp ? ` — ${new Date(s.version.timestamp).toLocaleDateString()}` : ''}
                                  </span>
                                ) : s.moduleHash && s.moduleHash !== 'None' ? (
                                  <span className="text-[11px] text-gray-500 font-mono truncate" title={s.moduleHash}>Module: {s.moduleHash.slice(0, 14)}...</span>
                                ) : s.moduleHash === 'None' ? (
                                  <span className="text-[11px] text-gray-600">No module installed</span>
                                ) : null}
                                {c.dependencies && c.dependencies.length > 0 && (
                                  <span className="text-[11px] text-gray-500">Deps: {c.dependencies.join(', ')}</span>
                                )}
                              </div>
                              {controllers.length > 0 && (
                                <div className="mt-2">
                                  <span className="text-[11px] text-gray-600">Controllers: </span>
                                  {controllers.map((ctrl, i) => (
                                    <span key={i} className="text-[11px] text-gray-500 font-mono" title={ctrl}>
                                      {ctrl.length > 20 ? ctrl.slice(0, 8) + '...' + ctrl.slice(-5) : ctrl}{i < controllers.length - 1 ? ', ' : ''}
                                    </span>
                                  ))}
                                </div>
                              )}
                              {/* Lifecycle actions */}
                              <div className="flex flex-wrap gap-2 mt-3">
                                {isMyCanister && isRunning && (
                                  <button onClick={() => stopCanister(c.name)} className="px-3 py-1.5 text-[11px] font-medium bg-yellow-500/10 text-yellow-400 border border-yellow-500/20 rounded-lg hover:bg-yellow-500/20 transition-colors">Stop</button>
                                )}
                                {isMyCanister && isStopped && (
                                  <>
                                    <button onClick={() => startCanister(c.name)} className="px-3 py-1.5 text-[11px] font-medium bg-green-500/10 text-green-400 border border-green-500/20 rounded-lg hover:bg-green-500/20 transition-colors">Start</button>
                                    <button onClick={() => deleteCanister(c.name)} className="px-3 py-1.5 text-[11px] font-medium bg-red-500/10 text-red-400 border border-red-500/20 rounded-lg hover:bg-red-500/20 transition-colors">Delete</button>
                                  </>
                                )}
                                {isMyCanister && hasData && (
                                  <>
                                    <button onClick={() => setTopUpModal({ canisterName: c.name })} className="px-3 py-1.5 text-[11px] font-medium bg-blue-500/10 text-blue-400 border border-blue-500/20 rounded-lg hover:bg-blue-500/20 transition-colors">Top Up</button>
                                    <button onClick={() => setControllersModal({ canisterName: c.name, controllers })} className="px-3 py-1.5 text-[11px] font-medium bg-purple-500/10 text-purple-400 border border-purple-500/20 rounded-lg hover:bg-purple-500/20 transition-colors">Controllers</button>
                                  </>
                                )}
                                <button onClick={() => fetchCanisterStatus(c.name)} className="px-3 py-1.5 text-[11px] font-medium bg-surface-800 text-gray-400 border border-surface-700 rounded-lg hover:bg-surface-700 transition-colors ml-auto">Refresh</button>
                              </div>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                ) : (
                  <div className="bg-surface-900 border border-surface-700 rounded-2xl px-5 py-12 text-center text-gray-500">
                    <p>Load a project to view canisters</p>
                  </div>
                )}
              </div>
            )}

            {tab === 'snapshots' && (
              <SnapshotsTab
                projectPath={projectPath}
                projectLoaded={projectLoaded}
                network={network}
                canisters={ownedCanisters}
                addToast={addToast}
              />
            )}
          </main>

          <FolderBrowser
            isOpen={folderBrowserOpen}
            onClose={() => setFolderBrowserOpen(false)}
            onSelect={(path) => {
              setProjectPath(path);
              loadProject(path);
            }}
          />

          <ConfirmModal
            isOpen={!!confirmModal}
            title={confirmModal?.title || ''}
            message={confirmModal?.message || ''}
            danger={confirmModal?.danger || false}
            onConfirm={confirmModal?.onConfirm || (() => {})}
            onCancel={() => setConfirmModal(null)}
          />

          <ReinstallConfirmModal
            isOpen={reinstallModalOpen}
            canisterCount={selectedCanisters.length}
            network={network}
            onConfirm={() => { setReinstallModalOpen(false); doDeployNow(); }}
            onCancel={() => setReinstallModalOpen(false)}
          />

          <MintModal
            isOpen={mintModalOpen}
            onClose={() => setMintModalOpen(false)}
            icpBalance={icpBalance}
            cyclesBalance={cyclesBalance}
            onMinted={() => { fetchIcpBalance(); fetchCyclesBalance(); }}
          />

          <SpendingModal
            isOpen={spendingModalOpen}
            onClose={() => setSpendingModalOpen(false)}
            topupHistory={topupHistory}
            network={network}
          />

          <TopUpModal
            isOpen={!!topUpModal}
            canisterName={topUpModal?.canisterName || ''}
            onClose={() => setTopUpModal(null)}
            icpBalance={icpBalance}
            cyclesBalance={cyclesBalance}
            onTopUp={executeTopUp}
          />

          <ControllersModal
            isOpen={!!controllersModal}
            canisterName={controllersModal?.canisterName || ''}
            controllers={canisterStatuses[controllersModal?.canisterName]?.controllers || controllersModal?.controllers || []}
            principal={principal}
            projectPath={projectPath}
            network={network}
            onDone={() => { fetchCanisterStatus(controllersModal?.canisterName); }}
            onClose={() => setControllersModal(null)}
          />

          {/* Toast notifications */}
          {toasts.length > 0 && (
            <div className="fixed bottom-6 right-6 z-50 space-y-2" style={{ pointerEvents: 'none' }}>
              {toasts.map((t) => (
                <div
                  key={t.id}
                  className={`flex items-center gap-2 px-4 py-3 rounded-xl shadow-lg text-sm font-medium border backdrop-blur-sm ${
                    t.type === 'success' ? 'bg-green-500/20 border-green-500/30 text-green-300' :
                    t.type === 'error' ? 'bg-red-500/20 border-red-500/30 text-red-300' :
                    'bg-surface-800 border-surface-700 text-gray-300'
                  }`}
                  style={{ pointerEvents: 'auto', animation: 'toast-in 0.3s ease-out' }}
                >
                  {t.type === 'success' && <span>✓</span>}
                  {t.type === 'error' && <span>✗</span>}
                  {t.message}
                  <button onClick={() => setToasts((prev) => prev.filter((x) => x.id !== t.id))} className="ml-2 text-gray-500 hover:text-white text-xs">×</button>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // Error boundary so the app doesn't go completely blank on errors
    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { error: null }; }
      static getDerivedStateFromError(error) { return { error }; }
      render() {
        if (this.state.error) {
          return React.createElement('div', { style: { padding: 40, color: '#fff', background: '#0f172a', minHeight: '100vh' } },
            React.createElement('h1', { style: { color: '#f87171', marginBottom: 16 } }, 'Something went wrong'),
            React.createElement('pre', { style: { color: '#fca5a5', fontSize: 14, whiteSpace: 'pre-wrap' } }, this.state.error.toString()),
            React.createElement('button', { onClick: () => this.setState({ error: null }), style: { marginTop: 16, padding: '8px 16px', background: '#3b5bdb', color: '#fff', border: 'none', borderRadius: 8, cursor: 'pointer' } }, 'Try again')
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      React.createElement(ErrorBoundary, null, React.createElement(App))
    );
  </script>
</body>
</html>
