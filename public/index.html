                </div>
                {metadata && (
                  <div className="mt-3">
                    <div className="flex items-center justify-between mb-1">
                      <span className="text-[11px] text-gray-500 font-mono">{metadata.name}</span>
                      <button onClick={() => setMetadata(null)} className="text-[11px] text-gray-600 hover:text-white">&times;</button>
                    </div>
                    {metadata.error ? (
                      <p className="text-xs text-red-400">{metadata.error}</p>
                    ) : (
                      <pre className="text-[11px] text-gray-300 bg-surface-950 border border-surface-800 rounded-lg p-3 overflow-auto max-h-48 font-mono whitespace-pre-wrap">{metadata.data}</pre>
                    )}
                  </div>
                )}
              </div>
            </div>

            {/* Right: Snapshot list */}
            <div className="lg:col-span-2">
              <div className="bg-surface-900 border border-surface-700 rounded-2xl overflow-hidden">
                <div className="px-5 py-4 border-b border-surface-700 flex items-center justify-between">
                  <div>
                    <h3 className="text-sm font-medium text-white">Snapshots</h3>
                    <p className="text-[11px] text-gray-500 mt-0.5">
                      {snapshots.length === 0 ? 'No snapshots yet' : `${snapshots.length} snapshot(s)`}
                    </p>
                  </div>
                </div>

                {loading ? (
                  <div className="flex items-center justify-center py-12">
                    <SpinnerIcon className="w-6 h-6 text-icp-400" />
                  </div>
                ) : snapshots.length === 0 ? (
                  <div className="px-5 py-12 text-center">
                    <svg className="w-10 h-10 text-gray-700 mx-auto mb-3" fill="none" viewBox="0 0 24 24" strokeWidth={1} stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z" />
                    </svg>
                    <p className="text-sm text-gray-500">No snapshots for this canister</p>
                    <p className="text-xs text-gray-600 mt-1">Create a snapshot to backup the canister state</p>
                  </div>
                ) : (
                  <div className="divide-y divide-surface-800">
                    {[...snapshots].sort((a, b) => new Date(b.takenAt) - new Date(a.takenAt)).map((snap) => (
                      <div key={snap.id} className="px-5 py-4">
                        <div className="flex items-start justify-between gap-3">
                          <div className="min-w-0 flex-1">
                            <p className="text-xs font-mono text-white truncate" title={snap.id}>{snap.id}</p>
                            <div className="flex items-center gap-3 mt-1.5">
                              {snap.takenAt && (
                                <span className="text-[11px] text-gray-500 flex items-center gap-1">
                                  <svg className="w-3 h-3" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg>
                                  {snap.takenAt}
                                </span>
                              )}
                              {snap.size && (
                                <span className="text-[11px] text-gray-500 flex items-center gap-1">
                                  <svg className="w-3 h-3" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" d="M20.25 6.375c0 2.278-3.694 4.125-8.25 4.125S3.75 8.653 3.75 6.375m16.5 0c0-2.278-3.694-4.125-8.25-4.125S3.75 4.097 3.75 6.375m16.5 0v11.25c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125V6.375" /></svg>
                                  {snap.size}
                                </span>
                              )}
                            </div>
                          </div>
                          <div className="flex items-center gap-1.5 shrink-0">
                            {/* Restore */}
                            <button
                              onClick={() => setConfirmAction({ type: 'load', id: snap.id })}
                              disabled={!!actionLoading || isRunning}
                              className="px-2.5 py-1.5 text-[11px] font-medium bg-icp-500/10 text-icp-400 border border-icp-500/20 rounded-lg hover:bg-icp-500/20 disabled:opacity-40 transition-colors"
                              title="Restore this snapshot"
                            >
                              {actionLoading === 'load:' + snap.id ? <SpinnerIcon className="w-3 h-3" /> : 'Restore'}
                            </button>
                            {/* Download */}
                            <button
                              onClick={() => { setShowDownloadInput(showDownloadInput === snap.id ? null : snap.id); setDownloadDir(projectPath ? projectPath + '/snapshots/' + snap.id.slice(0, 8) : ''); }}
                              disabled={!!actionLoading}
                              className="px-2.5 py-1.5 text-[11px] font-medium bg-surface-800 text-gray-300 border border-surface-700 rounded-lg hover:bg-surface-700 disabled:opacity-40 transition-colors"
                              title="Download snapshot to local disk"
                            >
                              {actionLoading === 'download:' + snap.id ? <SpinnerIcon className="w-3 h-3" /> : 'Download'}
                            </button>
                            {/* Delete */}
                            <button
                              onClick={() => setConfirmAction({ type: 'delete', id: snap.id })}
                              disabled={!!actionLoading}
                              className="px-2.5 py-1.5 text-[11px] font-medium bg-red-500/10 text-red-400 border border-red-500/20 rounded-lg hover:bg-red-500/20 disabled:opacity-40 transition-colors"
                              title="Delete this snapshot"
                            >
                              {actionLoading === 'delete:' + snap.id ? <SpinnerIcon className="w-3 h-3" /> : 'Delete'}
                            </button>
                          </div>
                        </div>

                        {/* Download input */}
                        {showDownloadInput === snap.id && (
                          <div className="mt-3 flex gap-2">
                            <input
                              type="text"
                              value={downloadDir}
                              onChange={(e) => setDownloadDir(e.target.value)}
                              placeholder="/path/to/download/dir"
                              className="flex-1 bg-surface-800 border border-surface-700 rounded-lg px-3 py-2 text-white text-xs font-mono focus:outline-none focus:border-icp-500"
                            />
                            <button
                              onClick={() => downloadSnapshot(snap.id)}
                              disabled={!downloadDir || !!actionLoading}
                              className="px-3 py-2 bg-icp-500/10 text-icp-400 border border-icp-500/20 rounded-lg text-xs font-medium hover:bg-icp-500/20 disabled:opacity-40 transition-colors"
                            >
                              Save
                            </button>
                            <button
                              onClick={() => setShowDownloadInput(null)}
                              className="px-2 py-2 text-xs text-gray-500 hover:text-white"
                            >
                              &times;
                            </button>
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          </div>

          {/* Confirmation modal for snapshot actions */}
          {confirmAction && (
            <ConfirmModal
              isOpen={true}
              title={confirmAction.type === 'load'
                ? `Restore snapshot?`
                : `Delete snapshot?`}
              message={confirmAction.type === 'load'
                ? `This will replace the canister's current code and data with the snapshot. Any data added after the snapshot was taken will be lost. The canister must be stopped.`
                : `This will permanently delete snapshot ${confirmAction.id.slice(0, 16)}... This cannot be undone.`}
              danger={confirmAction.type === 'delete'}
              onConfirm={() => {
                const action = confirmAction;
                setConfirmAction(null);
                if (action.type === 'load') loadSnapshot(action.id);
                else if (action.type === 'delete') deleteSnapshot(action.id);
              }}
              onCancel={() => setConfirmAction(null)}
            />
          )}
        </div>
      );
    }

    // ---- Deploy Summary View ----
    function DeploySummaryView({ summary, loading, network, projectLoaded, canisterConfigs }) {
      if (!projectLoaded) {
        return <p className="text-gray-600 text-sm">Load a project to see deployment summary.</p>;
      }
      if (loading) {
        return (
          <div className="flex items-center gap-2 text-gray-400 text-sm py-8 justify-center">
            <SpinnerIcon className="w-5 h-5" /> Analyzing deployment status...
          </div>
        );
      }
      if (!summary) {
        return <p className="text-gray-600 text-sm">Click Refresh to load deployment summary.</p>;
      }
      if (summary.error) {
        return <p className="text-red-400 text-sm">{summary.error}</p>;
      }

      const { canisters = {} } = summary;
      const canisterNames = Object.keys(canisters);
      const summaryNetLabel = network === 'ic' ? 'Production' : network === 'local' ? 'Local' : network.charAt(0).toUpperCase() + network.slice(1);

      // Count deployment states
      const deployed = canisterNames.filter(n => canisters[n].canisterId);
      const needsRedeploy = canisterNames.filter(n => {
        const conf = (canisterConfigs || []).find(cc => cc.name === n);
        if (conf && conf.type === 'assets') return false;
        return canisters[n].hashMatch === false;
      });
      const upToDate = canisterNames.filter(n => canisters[n].hashMatch === true);
      const notDeployed = canisterNames.filter(n => !canisters[n].canisterId);

      return (
        <div className="space-y-4 text-sm">
          {/* Deployment Status — local build vs on-chain */}
          <div>
            <h4 className="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Deployment Status — {summaryNetLabel}</h4>
            {needsRedeploy.length > 0 && (
              <div className="mb-2 flex items-center gap-2 p-2 bg-orange-500/10 border border-orange-500/20 rounded-lg">
                <svg className="w-3.5 h-3.5 text-orange-400 shrink-0" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" /></svg>
                <span className="text-[11px] text-orange-300">{needsRedeploy.length} canister{needsRedeploy.length > 1 ? 's have' : ' has'} local changes not yet deployed</span>
              </div>
            )}
            <div className="space-y-2">
              {canisterNames.map((name) => {
                const c = canisters[name];
                const isDeployed = !!c.canisterId;
                const hasLocalWasm = c.localWasmExists;
                const conf = (canisterConfigs || []).find(cc => cc.name === name);
                const isRemote = conf && (conf.remote || conf.type === 'pull' || (conf.type === 'unknown' && !conf.isPrebuilt));
                const isAssetCanister = conf && conf.type === 'assets';

                // Determine deploy state
                // Asset canisters use a fetched WASM (recipe), so local hash comparison is unreliable
                let badge, badgeClass;
                if (isRemote) {
                  badge = 'External'; badgeClass = 'bg-gray-500/20 text-gray-500';
                } else if (!isDeployed) {
                  badge = 'Not Deployed'; badgeClass = 'bg-gray-500/20 text-gray-400';
                } else if (isAssetCanister && c.hashMatch === false) {
                  badge = 'Deployed'; badgeClass = 'bg-blue-500/20 text-blue-400';
                } else if (c.hashMatch === true) {
                  badge = 'Up to Date'; badgeClass = 'bg-green-500/20 text-green-400';
                } else if (c.hashMatch === false) {
                  badge = 'Outdated'; badgeClass = 'bg-orange-500/20 text-orange-400';
                } else {
                  badge = 'Deployed'; badgeClass = 'bg-blue-500/20 text-blue-400';
                }

                return (
                  <div key={name} className={`bg-surface-900 border rounded-lg p-3 ${c.hashMatch === false ? 'border-orange-500/30' : 'border-surface-700'}`}>
                    <div className="flex items-center justify-between mb-1">
                      <span className="text-white font-medium">{name}</span>
                      <span className={`text-[11px] px-2 py-0.5 rounded-full ${badgeClass} ${isAssetCanister && isDeployed ? 'relative group' : ''}`}>
                        {badge}
                        {isAssetCanister && isDeployed && (
                          <span className="absolute bottom-full right-0 mb-1.5 hidden group-hover:block text-[10px] text-gray-300 bg-surface-800 border border-surface-600 rounded-lg px-2.5 py-1.5 whitespace-nowrap shadow-lg">Not built locally — no hash comparison</span>
                        )}
                      </span>
                    </div>
                    {isDeployed && (
                      <div className="text-xs text-gray-500 space-y-0.5">
                        <div>ID: <span className="text-gray-400 font-mono">{c.canisterId}</span></div>
                        {c.status && <div>Status: <span className={c.status === 'Running' ? 'text-green-400' : 'text-yellow-400'}>{c.status}</span></div>}
                        {c.hashMatch === false && !isAssetCanister && (
                          <div className="mt-1 text-orange-400">
                            <div>Local build differs from deployed version</div>
                            <div className="text-[10px] text-gray-600 font-mono mt-0.5">
                              Local: {c.localWasmHash ? c.localWasmHash.slice(0, 18) + '...' : 'unknown'}
                            </div>
                            <div className="text-[10px] text-gray-600 font-mono">
                              Chain: {c.moduleHash ? c.moduleHash.slice(0, 18) + '...' : 'unknown'}
                            </div>
                          </div>
                        )}
                        {c.hashMatch === true && c.version && (
                          <div className="flex items-center gap-1.5">
                            <span className="text-gray-500">Deployed:</span>
                            <span className="text-icp-400 font-mono">{c.version.gitCommit}</span>
                            {c.version.gitBranch && <span className="text-gray-600">({c.version.gitBranch})</span>}
                            {c.version.timestamp && (
                              <span className="text-gray-600">— {new Date(c.version.timestamp).toLocaleDateString()}</span>
                            )}
                          </div>
                        )}
                        {c.hashMatch === null && c.moduleHash && c.moduleHash !== 'None' && !c.localWasmHash && !isRemote && (
                          <div className="text-gray-600 text-[11px]">No local build found — run a build to compare</div>
                        )}
                      </div>
                    )}
                    {!isDeployed && hasLocalWasm && (
                      <div className="text-xs text-gray-500">Local WASM ready — will be a fresh install</div>
                    )}
                    {!isDeployed && !hasLocalWasm && (
                      <div className="text-xs text-gray-500">No local WASM — build required before deploy</div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>

        </div>
      );
    }

    // ---- Main App ----
    function App() {
      // State
      const [projectPath, setProjectPath] = useState('');
      const [network, setNetwork] = useState('local');
      const [identities, setIdentities] = useState([]);
      const [selectedIdentity, setSelectedIdentity] = useState('');
      const [principal, setPrincipal] = useState('');
      const [icpBalance, setIcpBalance] = useState(null);
      const [cyclesBalance, setCyclesBalance] = useState(null);
      const [mintModalOpen, setMintModalOpen] = useState(false);
      const [spendingModalOpen, setSpendingModalOpen] = useState(false);
      const [topUpModal, setTopUpModal] = useState(null); // { canisterName }
      const [controllersModal, setControllersModal] = useState(null); // { canisterName, controllers }
      const [cliInfo, setCliInfo] = useState({ cli: 'icp', version: '' });
      const [canisters, setCanisters] = useState([]);
      const [selectedCanisters, setSelectedCanisters] = useState([]);
      const [logs, setLogs] = useState([]);
      const [deployStatus, setDeployStatus] = useState('idle'); // idle, deploying, success, error, cancelled
      const [deployMode, setDeployMode] = useState(''); // '' = auto, 'upgrade', 'reinstall', 'install'
      const [projectLoaded, setProjectLoaded] = useState(false);
      const [folderBrowserOpen, setFolderBrowserOpen] = useState(false);
      const [replicaRunning, setReplicaRunning] = useState(false);
      const [canisterStatuses, setCanisterStatuses] = useState({});
      const [cyclesLedgerBalances, setCyclesLedgerBalances] = useState({}); // canisterId -> balance string
      const [topupHistory, setTopupHistory] = useState([]);
      const [tab, setTab] = useState('deploy'); // deploy, canisters
      const [loadingProject, setLoadingProject] = useState(false);
      const [projectLoadCount, setProjectLoadCount] = useState(0);
      const [configType, setConfigType] = useState('');
      const [confirmModal, setConfirmModal] = useState(null); // { title, message, danger, onConfirm }
      const [reinstallModalOpen, setReinstallModalOpen] = useState(false);
      const [availableNetworks, setAvailableNetworks] = useState(['local', 'ic']);
      const [rightPanel, setRightPanel] = useState('summary'); // 'summary' | 'logs'
      const [deploySummary, setDeploySummary] = useState(null);
      const [summaryLoading, setSummaryLoading] = useState(false);
      const [buildBeforeDeploy, setBuildBeforeDeploy] = useState(true);
      const [recentProjects, setRecentProjects] = useState([]);

      // Toast notifications
      const [toasts, setToasts] = useState([]);
      const addToast = useCallback((message, type = 'info') => {
        const id = Date.now() + Math.random();
        setToasts((prev) => [...prev, { id, message, type }]);
        setTimeout(() => setToasts((prev) => prev.filter((t) => t.id !== id)), 4000);
      }, []);

      // Collapsible sections
      const [identityExpanded, setIdentityExpanded] = useState(false);
      const [deployModeExpanded, setDeployModeExpanded] = useState(false);

      // Computed: outdated canister count and health summary
      const outdatedCount = React.useMemo(() => {
        if (!deploySummary || deploySummary.error) return 0;
        const sc = deploySummary.canisters || {};
        return Object.keys(sc).filter((n) => {
          const conf = (canisters || []).find((cc) => cc.name === n);
          if (conf && conf.type === 'assets') return false;
          return sc[n].hashMatch === false;
        }).length;
      }, [deploySummary, canisters]);

      const healthSummary = React.useMemo(() => {
        if (!deploySummary || deploySummary.error || !projectLoaded) return null;
        const sc = deploySummary.canisters || {};
        const names = Object.keys(sc);
        if (names.length === 0) return null;
        const upToDate = names.filter((n) => {
          if (sc[n].hashMatch === true) return true;
          // Assets canisters can't do hash comparison — count as up-to-date if deployed
          const conf = (canisters || []).find((cc) => cc.name === n);
          if (conf && conf.type === 'assets' && sc[n].canisterId) return true;
          return false;
        }).length;
        const deployed = names.filter((n) => sc[n].canisterId && sc[n].moduleHash && sc[n].moduleHash !== 'None').length;
        const notDeployed = names.filter((n) => !sc[n].canisterId).length;
        return { total: names.length, upToDate, deployed, outdated: outdatedCount, notDeployed };
      }, [deploySummary, canisters, projectLoaded, outdatedCount]);

      const wsRef = useRef(null);
      const logEndRef = useRef(null);

      // Auto-scroll logs
      useEffect(() => {
        logEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [logs]);

      // Fetch principal when identity changes
      const fetchPrincipal = useCallback(async () => {
        try {
          const data = await api.get('/api/identity/principal');
          if (data.principal) setPrincipal(data.principal);
        } catch { setPrincipal(''); }
      }, []);

      // Fetch cycles balance for current identity
      const fetchCyclesBalance = useCallback(async () => {
        try {
          const params = network && network !== 'local' ? `?network=${network}` : '';
          const data = await api.get(`/api/cycles/identity-balance${params}`);
          setCyclesBalance(data.cycles || null);
        } catch { setCyclesBalance(null); }
      }, [network]);

      // Fetch top-up history for current project
      const fetchTopupHistory = useCallback(async () => {
        if (!projectPath) return;
        try {
          const data = await api.post('/api/topup-history', { path: projectPath });
          setTopupHistory(Array.isArray(data) ? data : []);
        } catch { setTopupHistory([]); }
      }, [projectPath]);

      // Fetch ICP ledger balance for current identity
      const fetchIcpBalance = useCallback(async () => {
        try {
          const params = network && network !== 'local' ? `?network=${network}` : '';
          const data = await api.get(`/api/ledger/balance${params}`);
          setIcpBalance(data.balance || null);
        } catch { setIcpBalance(null); }
      }, [network]);

      // Load identities + CLI info + settings on mount
      useEffect(() => {
        api.get('/api/cli').then(setCliInfo).catch(() => {});

        api.get('/api/identities').then((data) => {
          if (Array.isArray(data)) {
            setIdentities(data);
            const active = data.find((i) => i.active);
            if (active) setSelectedIdentity(active.name);
          }
        }).catch(() => {});

        fetchPrincipal();
        fetchIcpBalance();
        fetchCyclesBalance();

        api.get('/api/replica/status').then((data) => {
          setReplicaRunning(data.running);
        }).catch(() => {});

        // Load saved settings
        api.get('/api/settings').then((settings) => {
          if (settings.recentProjects) setRecentProjects(settings.recentProjects);
          if (settings.buildBeforeDeploy !== undefined) setBuildBeforeDeploy(settings.buildBeforeDeploy);
          if (settings.lastNetwork) setNetwork(settings.lastNetwork);
          if (settings.lastProject) {
            setProjectPath(settings.lastProject);
          }
        }).catch(() => {});
      }, []);

      // Check if a canister is remote/external for the given network
      // remote.id.ic = "..." means it's external on mainnet but local on local
      const isRemoteForNetwork = useCallback((canister, net) => {
        if (canister.pullType) return true;
        if (canister.isPrebuilt && net !== 'local') return true;
        if (canister.type === 'unknown' && !canister.isPrebuilt) return true;
        if (!canister.remote || !canister.remote.id) return false;
        // Check the exact network key first, then fall back to 'ic' for any non-local network
        if (canister.remote.id[net]) return true;
        if (net !== 'local' && canister.remote.id.ic) return true;
        return false;
      }, []);

      // Filter to only owned (non-remote) canisters for current network
      const ownedCanisters = canisters.filter((c) => !isRemoteForNetwork(c, network));

      // Reset selected canisters when network or canister list changes
      useEffect(() => {
        setSelectedCanisters(ownedCanisters.map((c) => c.name));
      }, [network, canisters]);

      // Human-readable network label
      const networkLabel = network === 'ic' ? 'Production' : network === 'local' ? 'Local' : network.charAt(0).toUpperCase() + network.slice(1);

      // Load project
      const networkRef = React.useRef(network);
      networkRef.current = network;

      const loadProject = useCallback(async (path) => {
        if (!path) return;
        setLoadingProject(true);
        try {
          const data = await api.post('/api/project/info', { path });
          if (data.error) {
            setLogs((prev) => [...prev, { type: 'error', text: data.error }]);
            setProjectLoaded(false);
          } else {
            setCanisters(data.canisters);
            setCanisterStatuses({});
            setDeploySummary(null);
            setProjectLoaded(true);
            setConfigType(data.configType || 'icp.yaml');
            fetchTopupHistory();
            // Set available networks from project config
            const nets = data.networks && data.networks.length > 0 ? data.networks : ['local', 'ic'];
            if (!nets.includes('local')) nets.unshift('local');
            setAvailableNetworks(nets);
            const owned = data.canisters.filter((c) => !isRemoteForNetwork(c, networkRef.current));
            setLogs([{ type: 'info', text: `Loaded project from ${path} (${data.configType || 'icp.yaml'})` }]);
            setLogs((prev) => [
              ...prev,
              { type: 'info', text: `Found ${owned.length} canister(s): ${owned.map((c) => c.name).join(', ')}` },
            ]);
            if (nets.length > 2) {
              setLogs((prev) => [...prev, { type: 'info', text: `Networks: ${nets.map((n) => n === 'ic' ? 'Production (ic)' : n).join(', ')}` }]);
            }
            // Save to settings
            api.post('/api/settings', { lastProject: path }).catch(() => {});
            api.post('/api/settings/add-project', { path, name: path.split('/').pop() }).then((s) => {
              if (s.recentProjects) setRecentProjects(s.recentProjects);
            }).catch(() => {});
            // Bump refresh counter so useEffect re-fetches tab data
            setProjectLoadCount((c) => c + 1);
          }
        } catch (e) {
          setLogs((prev) => [...prev, { type: 'error', text: e.message }]);
        }
        setLoadingProject(false);
      }, []);

      // Fetch deploy summary
      const fetchDeploySummary = useCallback(async () => {
        if (!projectPath || !projectLoaded) return;
        setSummaryLoading(true);
        try {
          const data = await api.post('/api/deploy/summary', {
            path: projectPath,
            network,
            canisterNames: ownedCanisters.map((c) => c.name),
          });
          setDeploySummary(data);
        } catch (e) {
          setDeploySummary({ error: e.message });
        }
        setSummaryLoading(false);
      }, [projectPath, projectLoaded, network, canisters]);

      // Pre-load both summary and canister statuses when project loads or network changes
      useEffect(() => {
        if (projectLoaded && projectPath) {
          fetchDeploySummary();
          fetchAllCanisterStatuses();
        }
      }, [projectLoaded, network, projectLoadCount]);

      // Deploy (internal — called after confirmation)
      const doDeployNow = useCallback(() => {
        setDeployStatus('deploying');
        setLogs([]);
        setRightPanel('logs');

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);
        wsRef.current = ws;

        ws.onopen = () => {
          ws.send(
            JSON.stringify({
              action: 'deploy',
              path: projectPath,
              network,
              canisters: selectedCanisters,
              identity: selectedIdentity,
              mode: deployMode || undefined,
              build: buildBeforeDeploy,
            })
          );
        };

        ws.onmessage = (event) => {
          let msg;
          try { msg = JSON.parse(event.data); } catch { return; }
          if (msg.type === 'log') {
            setLogs((prev) => [...prev, { type: 'log', text: msg.data }]);
          } else if (msg.type === 'status') {
            if (['success', 'error', 'cancelled'].includes(msg.data)) {
              setDeployStatus(msg.data);
              ws.close();
              fetchDeploySummary();
              if (msg.data === 'success') addToast('Deploy completed successfully', 'success');
              else if (msg.data === 'error') addToast('Deploy failed — check logs', 'error');
              else if (msg.data === 'cancelled') addToast('Deploy cancelled', 'info');
            }
          } else if (msg.type === 'error') {
            setLogs((prev) => [...prev, { type: 'error', text: msg.data }]);
          }
        };

        ws.onerror = () => {
          setDeployStatus('error');
          setLogs((prev) => [...prev, { type: 'error', text: 'WebSocket connection failed' }]);
          ws.close();
        };
      }, [projectPath, network, selectedCanisters, selectedIdentity, canisters, deployMode]);

      // Deploy with confirmation for mainnet / reinstall
      const deploy = useCallback(() => {
        if (!projectPath || deployStatus === 'deploying') return;

        if (deployMode === 'reinstall') {
          setReinstallModalOpen(true);
          return;
        }

        if (network !== 'local') {
          const netLabel = network === 'ic' ? 'PRODUCTION (mainnet)' : `"${network}" network`;
          setConfirmModal({
            title: `Deploy to ${network === 'ic' ? 'Production' : network}`,
            message: `You are about to deploy ${selectedCanisters.length} canister(s) to ${netLabel}. This will consume real cycles. Continue?`,
            danger: network === 'ic',
            onConfirm: () => { setConfirmModal(null); doDeployNow(); },
          });
          return;
        }

        doDeployNow();
      }, [projectPath, deployStatus, network, selectedCanisters, deployMode, doDeployNow]);

      const cancelDeploy = useCallback(() => {
        const ws = wsRef.current;
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ action: 'cancel' }));
        }
      }, []);

      const replicaWsRef = useRef(null);
      const startReplica = useCallback(() => {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);
        replicaWsRef.current = ws;
        ws.onopen = () => {
          ws.send(JSON.stringify({ action: 'start-replica', path: projectPath }));
          setLogs((prev) => [...prev, { type: 'info', text: 'Starting local replica...' }]);
        };
        ws.onmessage = (event) => {
          let msg;
          try { msg = JSON.parse(event.data); } catch { return; }
          if (msg.type === 'log') {
            setLogs((prev) => [...prev, { type: 'log', text: msg.data }]);
          } else if (msg.type === 'status') {
            if (msg.data === 'replica-running') {
              setReplicaRunning(true);
              setLogs((prev) => [...prev, { type: 'info', text: 'Local replica is running' }]);
              ws.close();
              replicaWsRef.current = null;
            }
          }
        };
        ws.onerror = () => {
          setLogs((prev) => [...prev, { type: 'error', text: 'Failed to start replica' }]);
          ws.close();
          replicaWsRef.current = null;
        };
      }, [projectPath]);

      const [loadingStatuses, setLoadingStatuses] = useState(false);

      const fetchCanisterStatus = useCallback(async (canisterName) => {
        setCanisterStatuses((prev) => ({ ...prev, [canisterName]: { ...prev[canisterName], loading: true } }));
        try {
          const data = await api.post('/api/canister/status', {
            path: projectPath,
            canister: canisterName,
            network,
          });
          setCanisterStatuses((prev) => ({ ...prev, [canisterName]: { ...data, loading: false } }));
        } catch {
          setCanisterStatuses((prev) => ({
            ...prev,
            [canisterName]: { error: 'Failed to fetch', loading: false },
          }));
        }
      }, [projectPath, network]);

      const fetchAllCanisterStatuses = useCallback(async () => {
        const owned = canisters.filter((c) => !isRemoteForNetwork(c, network));
        if (!projectLoaded || owned.length === 0) return;
        setLoadingStatuses(true);
        try {
          const data = await api.post('/api/canisters/status-all', {
            path: projectPath,
            network,
            canisterNames: owned.map((c) => c.name),
          });
          setCanisterStatuses(data);
          // Fetch cycles ledger balances for canisters that have IDs (non-local only)
          if (network && network !== 'local') {
            const ids = Object.values(data).map(s => s.canisterId).filter(Boolean);
            if (ids.length > 0) {
              try {
                const ledgerData = await api.post('/api/cycles/ledger-balances', { canisterIds: ids, network });
                setCyclesLedgerBalances(ledgerData);
              } catch { /* non-critical */ }
            }
          }
        } catch {
          // individual errors are in the response per-canister
        }
        setLoadingStatuses(false);
      }, [projectPath, network, projectLoaded, canisters]);

      // Clear cached statuses when network changes (statuses are per-network)
      useEffect(() => {
        setCanisterStatuses({});
        setCyclesLedgerBalances({});
      }, [network]);

      // Canister lifecycle actions
      const canisterAction = useCallback(async (action, canisterName) => {
        setCanisterStatuses((prev) => ({ ...prev, [canisterName]: { ...prev[canisterName], loading: true } }));
        try {
          await api.post(`/api/canister/${action}`, {
            path: projectPath,
            canister: canisterName,
            network,
          });
          // Re-fetch status after action
          await fetchCanisterStatus(canisterName);
        } catch (e) {
          setCanisterStatuses((prev) => ({
            ...prev,
            [canisterName]: { ...prev[canisterName], error: e.message, loading: false },
          }));
        }
      }, [projectPath, network, fetchCanisterStatus]);

      const stopCanister = useCallback((name) => {
        setConfirmModal({
          title: `Stop canister "${name}"?`,
          message: 'The canister will stop processing requests. You can restart it later.',
          danger: false,
          onConfirm: () => { setConfirmModal(null); canisterAction('stop', name); },
        });
      }, [canisterAction]);

      const startCanister = useCallback((name) => canisterAction('start', name), [canisterAction]);

      const deleteCanister = useCallback((name) => {
        setConfirmModal({
          title: `DELETE canister "${name}"?`,
          message: 'This will permanently delete the canister and all its data. This cannot be undone.',
          danger: true,
          confirmPhrase: 'delete this canister',
          onConfirm: () => { setConfirmModal(null); canisterAction('delete', name); },
        });
      }, [canisterAction]);

      // Top up canister with cycles (called from TopUpModal)
      const executeTopUp = useCallback(async (name, amount, source) => {
        setCanisterStatuses((prev) => ({ ...prev, [name]: { ...prev[name], loading: true } }));
        try {
          const data = await api.post('/api/canister/top-up', { path: projectPath, canister: name, network, amount, source });
          if (data.ok) {
            setLogs((prev) => [...prev, { type: 'info', text: `Topped up ${name}: ${data.output}` }]);
            addToast(`Topped up ${name}`, 'success');
          } else {
            setLogs((prev) => [...prev, { type: 'error', text: `Top-up failed: ${data.output}` }]);
            addToast(`Top-up failed for ${name}`, 'error');
          }
          await fetchCanisterStatus(name);
          fetchTopupHistory();
          fetchCyclesBalance();
          fetchIcpBalance();
        } catch (e) {
          setCanisterStatuses((prev) => ({ ...prev, [name]: { ...prev[name], error: e.message, loading: false } }));
        }
      }, [projectPath, network, fetchCanisterStatus, fetchTopupHistory, fetchCyclesBalance, fetchIcpBalance]);

      // Add controller to canister
      const addController = useCallback((name) => {
        const principal = prompt('Enter principal ID to add as controller:');
        if (!principal || !/^[a-z0-9-]+$/.test(principal)) {
          if (principal) alert('Invalid principal ID format');
          return;
        }
        setConfirmModal({
          title: `Add controller to "${name}"`,
          message: `Add ${principal.slice(0, 10)}...${principal.slice(-5)} as a controller of "${name}" on ${networkLabel}?`,
          danger: false,
          onConfirm: async () => {
            setConfirmModal(null);
            setCanisterStatuses((prev) => ({ ...prev, [name]: { ...prev[name], loading: true } }));
            try {
              await api.post('/api/canister/update-settings', { path: projectPath, canister: name, network, addController: principal });
              setLogs((prev) => [...prev, { type: 'info', text: `Added controller to ${name}: ${principal}` }]);
              await fetchCanisterStatus(name);
            } catch (e) {
              setCanisterStatuses((prev) => ({ ...prev, [name]: { ...prev[name], error: e.message, loading: false } }));
            }
          },
        });
      }, [projectPath, network, networkLabel, fetchCanisterStatus]);

      const toggleCanister = (name) => {
        setSelectedCanisters((prev) =>
          prev.includes(name) ? prev.filter((c) => c !== name) : [...prev, name]
        );
      };

      const statusColor = {
        idle: 'bg-gray-600',
        deploying: 'bg-yellow-500',
        success: 'bg-green-500',
        error: 'bg-red-500',
        cancelled: 'bg-orange-500',
      };

      return (
        <div className="min-h-screen text-white">
          {/* Header */}
          <header className="border-b border-surface-700 bg-surface-900/80 backdrop-blur-sm sticky top-0 z-40">
            <div className="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-icp-500 to-icp-700 flex items-center justify-center">
                  <RocketIcon className="w-5 h-5 text-white" />
                </div>
                <div>
                  <h1 className="text-lg font-bold text-white tracking-tight">ICP Deploy</h1>
                  <p className="text-xs text-gray-500">Dashboard</p>
                </div>
              </div>
              <div className="flex items-center gap-4">
                {healthSummary && (
                  <div className="flex items-center gap-2 px-2.5 py-1 bg-surface-800 border border-surface-700 rounded-lg">
                    <div className={`w-2 h-2 rounded-full ${
                      healthSummary.outdated > 0 ? 'bg-orange-400' :
                      healthSummary.notDeployed > 0 ? 'bg-yellow-400' :
                      'bg-green-400'
                    }`} />
                    <span className="text-[11px] text-gray-400">
                      {healthSummary.upToDate}/{healthSummary.total} up to date
                      {healthSummary.outdated > 0 && <span className="text-orange-400 ml-1">({healthSummary.outdated} outdated)</span>}
                      {healthSummary.notDeployed > 0 && <span className="text-yellow-400 ml-1">({healthSummary.notDeployed} not deployed)</span>}
                    </span>
                  </div>
                )}
                <span className="text-[11px] text-gray-600 font-mono">{cliInfo.version?.split('\n')[0] || cliInfo.cli}</span>
                {(icpBalance !== null || cyclesBalance !== null) && (
                  <div className="flex items-center gap-2 px-2.5 py-1 bg-surface-800 border border-surface-700 rounded-lg">
                    {icpBalance !== null && (
                      <button
                        onClick={() => setSpendingModalOpen(true)}
                        className="text-[11px] font-semibold text-icp-400 font-mono hover:text-icp-300 transition-colors"
                        title="View spending history"
                      >
                        {parseFloat(icpBalance).toFixed(4)} ICP
                      </button>
                    )}
                    {icpBalance !== null && cyclesBalance !== null && (
                      <span className="text-gray-600">|</span>
                    )}
                    {cyclesBalance !== null && (
                      <button
                        onClick={() => setSpendingModalOpen(true)}
                        className="text-[11px] font-semibold text-green-400 font-mono hover:text-green-300 transition-colors"
                        title="View spending history"
                      >
                        {(() => {
                          const n = Number(cyclesBalance);
                          if (n >= 1e12) return `${(n / 1e12).toFixed(2)}T`;
                          if (n >= 1e9) return `${(n / 1e9).toFixed(2)}B`;
                          if (n >= 1e6) return `${(n / 1e6).toFixed(1)}M`;
                          return n.toLocaleString();
                        })()} cycles
                      </button>
                    )}
                    <button
                      onClick={() => setMintModalOpen(true)}
                      className="text-[10px] px-1.5 py-0.5 bg-icp-500/10 text-icp-400 border border-icp-500/20 rounded hover:bg-icp-500/20 transition-colors font-medium"
                      title="Mint cycles from ICP"
                    >Mint</button>
                    <button
                      onClick={() => { fetchIcpBalance(); fetchCyclesBalance(); }}
                      className="text-[10px] px-1 py-0.5 text-gray-500 hover:text-gray-300 transition-colors"
                      title="Refresh balances"
                    >
                      <svg className="w-3 h-3" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182" />
                      </svg>
                    </button>
                  </div>
                )}
                {principal && (
                  <button
                    onClick={() => { navigator.clipboard.writeText(principal); addToast('Principal copied', 'success'); }}
                    className="text-[11px] text-gray-500 font-mono max-w-[140px] truncate hover:text-gray-300 transition-colors"
                    title={`${principal}\nClick to copy`}
                  >
                    {principal.slice(0, 8)}...{principal.slice(-5)}
                  </button>
                )}
                <div className="flex items-center gap-2">
                  <div className={`w-2 h-2 rounded-full ${replicaRunning ? 'bg-green-400' : 'bg-gray-600'}`} />
                  <span className="text-xs text-gray-400">
                    Replica {replicaRunning ? 'running' : 'stopped'}
                  </span>
                  {!replicaRunning && (
                    <button onClick={startReplica} className="text-[10px] px-1.5 py-0.5 bg-green-500/10 text-green-400 border border-green-500/20 rounded hover:bg-green-500/20 transition-colors font-medium">Start</button>
                  )}
                  {replicaRunning && (
                    <button onClick={async () => { await api.post('/api/replica/stop'); setReplicaRunning(false); setLogs((prev) => [...prev, { type: 'info', text: 'Replica stopped' }]); }} className="text-[10px] px-1.5 py-0.5 bg-red-500/10 text-red-400 border border-red-500/20 rounded hover:bg-red-500/20 transition-colors font-medium">Stop</button>
                  )}
                </div>
                <div className="flex items-center gap-2">
                  <div className={`w-2 h-2 rounded-full ${statusColor[deployStatus]}`} />
                  <span className="text-xs text-gray-400 capitalize">{deployStatus}</span>
                </div>
              </div>
            </div>
          </header>

          <main className="max-w-6xl mx-auto px-6 py-6">
            {/* Project Selector */}
            <div className="mb-6">
              <label className="block text-sm font-medium text-gray-300 mb-2">Project Folder</label>
              <div className="flex gap-2">
                <div className="flex-1 relative">
                  <input
                    type="text"
                    value={projectPath}
                    onChange={(e) => {
                      setProjectPath(e.target.value);
                      setProjectLoaded(false);
                    }}
                    onBlur={() => projectPath && !projectLoaded && loadProject(projectPath)}
                    onKeyDown={(e) => e.key === 'Enter' && loadProject(projectPath)}
                    placeholder="/path/to/your/icp-project"
                    className="w-full bg-surface-800 border border-surface-700 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-icp-500 focus:ring-1 focus:ring-icp-500/50 font-mono text-sm"
                  />
                  {projectLoaded && (
                    <div className="absolute right-3 top-1/2 -translate-y-1/2">
                      <svg className="w-5 h-5 text-green-400" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" d="m4.5 12.75 6 6 9-13.5" />
                      </svg>
